<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princess Crosses the River!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; }
canvas { display: block; margin: 0 auto; }
#back-btn {
  position: absolute;
  top: 12px; left: 12px;
  background: rgba(255,255,255,0.9);
  border: 3px solid #e91e63;
  border-radius: 12px;
  padding: 8px 18px;
  font-size: 20px;
  font-weight: bold;
  color: #e91e63;
  cursor: pointer;
  text-decoration: none;
  z-index: 10;
  font-family: 'Segoe UI', sans-serif;
}
#back-btn:hover { background: #fce4ec; }
</style>
</head>
<body>
<a id="back-btn" href="index.html">← Home</a>
<canvas id="c"></canvas>
<script>
// ================================================================
//  Princess Crosses the River — Kids Typing Game
// ================================================================

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); initScene(); });

function W()      { return canvas.width; }
function H()      { return canvas.height; }
function GY()     { return H() * 0.68; }        // water surface Y
function BANK_W() { return W() * 0.18; }

const BRICK_COUNT = 5;
const BRICK_H     = 24;
const BRICK_W     = 64;
const PRINCESS_H  = 40;   // distance from princess.y to her feet (approx)

// ─── Random letters ─────────────────────────────────────────────
// Pick n distinct random letters from a-z, shuffled
function randomLetters(n) {
  const pool = 'abcdefghijklmnopqrstuvwxyz'.split('');
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, n);
}

// ─── State ──────────────────────────────────────────────────────
// States: title | intro | waiting | jumping | jumping_bank | walking_away | celebrating
let state         = 'title';
let bricks        = [];
let currentBrick  = 0;   // index of NEXT brick to jump to (0..BRICK_COUNT)
let princess      = {};
let particles     = [];
let popups        = [];
let waveOffset    = 0;
let fish          = [];
let clouds        = [];
let time          = 0;
let resetTimer    = 0;
let autoJumpTimer = 0;   // counts down after landing on last brick → auto-jump to bank

// Jump animation state
let jumpStartX, jumpStartY, jumpTargetX, jumpTargetY, jumpProgress, jumpDuration;
let jumpToBrickIdx = -1;  // brick index we're jumping to, or -1 for right bank

// ─── Init / reset ───────────────────────────────────────────────
function initScene() {
  const gy     = GY();
  const bw     = BANK_W();
  const riverW = W() - bw * 2;
  const spacing = riverW / (BRICK_COUNT + 1);
  const letters = randomLetters(BRICK_COUNT);

  bricks = [];
  for (let i = 0; i < BRICK_COUNT; i++) {
    const bx = bw + spacing * (i + 1);
    // Sit bricks ABOVE the water line so the princess stands clear of the river
    const baseY = gy - BRICK_H - 18;
    bricks.push({
      x: bx,
      baseY,
      y: baseY,
      letter: letters[i],
      phase: Math.random() * Math.PI * 2,
    });
  }

  princess = {
    x: -50,
    y: gy - PRINCESS_H,
    facingRight: true,
    legFrame: 0,
    legTimer: 0,
  };

  currentBrick  = 0;
  particles     = [];
  popups        = [];
  autoJumpTimer = 0;
  resetTimer    = 0;
  jumpToBrickIdx = -1;

  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x: Math.random() * W(),
      y: 30 + Math.random() * GY() * 0.35,
      w: 70 + Math.random() * 90,
      h: 25 + Math.random() * 18,
      spd: 0.25 + Math.random() * 0.3,
    });
  }

  fish = [];
  for (let i = 0; i < 4; i++) {
    fish.push({
      x: BANK_W() + Math.random() * (W() - BANK_W() * 2),
      y: GY() + 28 + Math.random() * 40,
      dir: Math.random() < 0.5 ? 1 : -1,
      spd: 18 + Math.random() * 22,
      popTimer: 3 + Math.random() * 7,
      popping: false,
      popY: 0,
    });
  }
}

// ─── Jump logic ──────────────────────────────────────────────────
function startJump(targetBrickIdx) {
  // Jump to brick[targetBrickIdx], or right bank if -1
  jumpStartX    = princess.x;
  jumpStartY    = princess.y;
  jumpToBrickIdx = targetBrickIdx;

  if (targetBrickIdx >= 0) {
    const b = bricks[targetBrickIdx];
    jumpTargetX = b.x;
    jumpTargetY = b.y - PRINCESS_H + 2;  // will be snapped on landing
    jumpDuration = 0.52;
    state = 'jumping';
  } else {
    // Jumping to right bank
    jumpTargetX = W() - BANK_W() * 0.55;
    jumpTargetY = GY() - PRINCESS_H;
    jumpDuration = 0.65;
    state = 'jumping_bank';
  }

  jumpProgress = 0;
  princess.facingRight = jumpTargetX > princess.x;
  spawnJumpParticles(princess.x, princess.y);
}

function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }

function jumpXY(t) {
  const ex  = easeInOut(t);
  const arc = Math.sin(Math.PI * t);
  const maxArc = Math.min(GY() * 0.38, 200);
  return {
    x: jumpStartX + (jumpTargetX - jumpStartX) * ex,
    y: jumpStartY + (jumpTargetY - jumpStartY) * ex - arc * maxArc,
  };
}

// ─── Update ──────────────────────────────────────────────────────
function update(dt) {
  time       += dt;
  waveOffset += dt * 28;

  // Clouds drift
  for (const cl of clouds) {
    cl.x -= cl.spd;
    if (cl.x + cl.w < 0) { cl.x = W() + 20; cl.y = 30 + Math.random() * GY() * 0.35; }
  }

  // Brick bobbing (always)
  for (const b of bricks) {
    b.y = b.baseY + Math.sin(time * 1.8 + b.phase) * 5;
  }

  updateFish(dt);
  updateParticles(dt);
  updatePopups(dt);

  // Leg animation
  if (state !== 'title') {
    princess.legTimer += dt;
    if (princess.legTimer > 0.15) { princess.legFrame = 1 - princess.legFrame; princess.legTimer = 0; }
  }

  // ── State machine ──────────────────────────────────────────────

  if (state === 'intro') {
    const targetX = BANK_W() - 14;
    const dx = targetX - princess.x;
    princess.y = GY() - PRINCESS_H;
    if (Math.abs(dx) < 2) {
      princess.x = targetX;
      state = 'waiting';
    } else {
      princess.x += Math.min(dx, 110 * dt);
    }

  } else if (state === 'jumping') {
    jumpProgress += dt / jumpDuration;
    if (jumpProgress >= 1) {
      // Snap to brick's CURRENT y (compensates for bobbing during flight)
      const b = bricks[jumpToBrickIdx];
      princess.x = b.x;
      princess.y = b.y - PRINCESS_H + 2;   // feet sit on top of brick
      spawnJumpParticles(princess.x, princess.y - 10);
      addPopup('⭐ ' + bricks[jumpToBrickIdx].letter.toUpperCase() + '!',
               princess.x, princess.y - 55);

      if (jumpToBrickIdx === BRICK_COUNT - 1) {
        // Landed on the LAST brick — auto-jump to bank after short pause
        autoJumpTimer = 0.7;
        addPopup('🌟 Last one!', princess.x, princess.y - 80);
      }
      state = 'waiting';
    } else {
      const pos = jumpXY(jumpProgress);
      princess.x = pos.x;
      princess.y = pos.y;
    }

  } else if (state === 'jumping_bank') {
    jumpProgress += dt / jumpDuration;
    if (jumpProgress >= 1) {
      princess.x = jumpTargetX;
      princess.y = jumpTargetY;
      spawnJumpParticles(princess.x, princess.y - 10);
      state = 'walking_away';
    } else {
      const pos = jumpXY(jumpProgress);
      princess.x = pos.x;
      princess.y = pos.y;
    }

  } else if (state === 'waiting') {
    // Keep princess glued to her current surface (brick bobbing or ground)
    if (currentBrick > 0 && currentBrick <= BRICK_COUNT) {
      // Standing on brick[currentBrick - 1]
      const b = bricks[currentBrick - 1];
      princess.y = b.y - PRINCESS_H + 2;
    } else if (currentBrick === 0) {
      princess.y = GY() - PRINCESS_H;
    }

    // After landing on last brick, auto-jump to right bank
    if (currentBrick >= BRICK_COUNT && autoJumpTimer > 0) {
      autoJumpTimer -= dt;
      if (autoJumpTimer <= 0) {
        startJump(-1);   // -1 = right bank
      }
    }

  } else if (state === 'walking_away') {
    // Princess walks right across the far bank and off screen
    princess.x += 100 * dt;
    princess.y  = GY() - PRINCESS_H;
    princess.facingRight = true;
    if (princess.x > W() + 80) {
      state = 'celebrating';
      resetTimer = 0;
      spawnCelebrationParticles();
      addPopup('🎉 She made it! 🎉', W() * 0.65, GY() - 80);
    }

  } else if (state === 'celebrating') {
    resetTimer += dt;
    if (Math.random() < 0.12) spawnCelebrationParticles();
    if (resetTimer > 3.5) {
      initScene();
      state = 'intro';
    }
  }
}

// ─── Drawing helpers ─────────────────────────────────────────────
function roundRect(x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);   ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);   ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);     ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath(); ctx.fill();
}

function roundRectStroke(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);   ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);   ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);     ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ─── Background ──────────────────────────────────────────────────
function drawBackground() {
  const gy = GY();
  const bw = BANK_W();

  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, '#1a1a5e');
  sky.addColorStop(0.6, '#2e5fa3');
  sky.addColorStop(1, '#87ceeb');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W(), gy);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 25; i++) {
    const sx = (i * 173 + 30) % W();
    const sy = (i * 89 + 10)  % (gy * 0.45);
    ctx.beginPath(); ctx.arc(sx, sy, 1 + (i % 2), 0, Math.PI*2); ctx.fill();
  }

  // Clouds
  for (const cl of clouds) {
    roundRect(cl.x, cl.y, cl.w, cl.h, cl.h/2, 'rgba(255,255,255,0.22)');
    roundRect(cl.x + cl.w*0.2, cl.y - cl.h*0.3, cl.w*0.55, cl.h*0.6, cl.h*0.3, 'rgba(255,255,255,0.18)');
  }

  // River water
  const water = ctx.createLinearGradient(0, gy, 0, H());
  water.addColorStop(0, '#1e90ff');
  water.addColorStop(0.4, '#1565c0');
  water.addColorStop(1, '#0d47a1');
  ctx.fillStyle = water;
  ctx.fillRect(bw, gy, W() - bw*2, H() - gy);

  // Water shimmer
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5;
  for (let row = 0; row < 6; row++) {
    const wy = gy + 18 + row * 22;
    for (let col = 0; col < 8; col++) {
      const segW = (W() - bw*2) / 8;
      const wx = bw + col * segW + ((waveOffset * (row%2===0?1:-1) * 0.6)) % segW;
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.bezierCurveTo(wx+12, wy-4, wx+24, wy+4, wx+36, wy);
      ctx.stroke();
    }
  }

  // Banks
  const bankGrad = ctx.createLinearGradient(0, gy - 6, 0, H());
  bankGrad.addColorStop(0, '#4caf50');
  bankGrad.addColorStop(0.25, '#388e3c');
  bankGrad.addColorStop(1, '#1b5e20');
  ctx.fillStyle = bankGrad;
  ctx.fillRect(0, gy, bw + 6, H() - gy);
  ctx.fillRect(W() - bw - 6, gy, bw + 6, H() - gy);
  ctx.fillStyle = '#66bb6a';
  ctx.fillRect(0, gy - 8, bw + 6, 10);
  ctx.fillRect(W() - bw - 6, gy - 8, bw + 6, 10);

  // Grass tufts
  ctx.fillStyle = '#81c784';
  for (let i = 0; i < 10; i++) {
    drawGrassTuft((i*23+5) % (bw - 10), gy - 6);
    drawGrassTuft(W() - bw + (i*23+8) % (bw - 10), gy - 6);
  }

  // Goal marker on right bank
  drawGoal(W() - bw * 0.5, gy - 14);
}

function drawGrassTuft(x, y) {
  ctx.beginPath(); ctx.moveTo(x-4,y); ctx.lineTo(x,y-10); ctx.lineTo(x+4,y); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+2,y); ctx.lineTo(x+6,y-7); ctx.lineTo(x+9,y); ctx.closePath(); ctx.fill();
}

function drawGoal(x, y) {
  ctx.font = '30px serif'; ctx.textAlign = 'center';
  ['🌸','🌺','🌻'].forEach((f,i) => ctx.fillText(f, x + (i-1)*26, y));
  const r = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6'];
  r.forEach((col,i) => {
    ctx.strokeStyle = col; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(x, y + 8, 34 + i*5, Math.PI, 0, false); ctx.stroke();
  });
}

// ─── Bricks ──────────────────────────────────────────────────────
function drawBricks() {
  const s = Math.max(Math.min(W()/800, H()/450), 0.7);

  bricks.forEach((b, i) => {
    const isCurrent = (i === currentBrick && (state === 'waiting' || state === 'jumping'));
    const isPassed  = i < currentBrick;

    const brickTop = b.y;

    // Glow ring for current target
    if (isCurrent) {
      const pulse = 0.5 + 0.5 * Math.abs(Math.sin(time * 5));
      ctx.strokeStyle = `rgba(255,230,0,${pulse})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(b.x, brickTop + BRICK_H + 4, BRICK_W/2 + 14, 10, 0, 0, Math.PI*2);
      ctx.stroke();
    }

    // Brick body
    const col = isPassed ? '#546e7a' : isCurrent ? '#8d6e63' : '#6d4c41';
    roundRect(b.x - BRICK_W/2, brickTop, BRICK_W, BRICK_H, 6, col);

    // Mortar lines
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(b.x - BRICK_W/2, brickTop + BRICK_H/2); ctx.lineTo(b.x + BRICK_W/2, brickTop + BRICK_H/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x, brickTop); ctx.lineTo(b.x, brickTop + BRICK_H/2); ctx.stroke();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(b.x - BRICK_W/2 + 4, brickTop + 3, BRICK_W - 8, 5);

    // Moss on unpassed bricks
    if (!isPassed) {
      ctx.fillStyle = '#66bb6a';
      for (let m = 0; m < 3; m++) {
        ctx.beginPath(); ctx.arc(b.x - 18 + m*18, brickTop + 1, 4, Math.PI, 0); ctx.fill();
      }
    }

    // Letter label
    if (!isPassed) {
      const letter = b.letter.toUpperCase();
      if (isCurrent) {
        // Bouncy key-cap
        const bounce = Math.sin(time * 6) * 5;
        const cap    = Math.round(36 * s);
        const lx     = b.x - cap/2;
        const ly     = brickTop - cap - 14 + bounce;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        roundRect(lx+3, ly+5, cap, cap, 9, 'rgba(0,0,0,0.18)');
        // Cap
        roundRect(lx, ly, cap, cap, 9, '#fff176');
        ctx.strokeStyle = '#f9a825'; ctx.lineWidth = 2.5;
        roundRectStroke(lx, ly, cap, cap, 9); ctx.stroke();
        // Letter
        ctx.fillStyle = '#e65100';
        ctx.font = `bold ${Math.round(23*s)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(letter, b.x, ly + cap * 0.72);
        // Arrow
        ctx.fillStyle = '#fff176';
        ctx.beginPath();
        ctx.moveTo(b.x-7, ly+cap+1); ctx.lineTo(b.x+7, ly+cap+1); ctx.lineTo(b.x, ly+cap+12);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.font = `bold ${Math.round(16*s)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(letter, b.x, brickTop - 10);
      }
    }
  });
}

// ─── Princess ────────────────────────────────────────────────────
function drawPrincess(px, py, opts = {}) {
  const s    = Math.max(Math.min(W()/800, H()/450), 0.7);
  const flip = opts.facingLeft ? -1 : 1;
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(flip, 1);
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;

  // Dress
  ctx.fillStyle = '#ff69b4';
  ctx.fillRect(-12*s, -5*s, 24*s, 30*s);
  ctx.fillStyle = '#ff85c8';
  ctx.beginPath();
  ctx.moveTo(-14*s,25*s); ctx.lineTo(14*s,25*s); ctx.lineTo(10*s,10*s); ctx.lineTo(-10*s,10*s);
  ctx.closePath(); ctx.fill();

  // Head
  ctx.fillStyle = '#ffdab9';
  ctx.beginPath(); ctx.arc(0, -16*s, 10*s, 0, Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(-11*s,-26*s,22*s,8*s);
  ctx.fillRect(-12*s,-20*s,4*s,18*s);
  ctx.fillRect(8*s,  -20*s,4*s,18*s);

  // Crown
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(-8*s,-30*s,16*s,5*s);
  [[-8,-38],[0,-36],[8,-38]].forEach(([tx,ty]) => {
    ctx.beginPath(); ctx.moveTo((tx-2)*s,-30*s); ctx.lineTo(tx*s,ty*s); ctx.lineTo((tx+2)*s,-30*s); ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle = '#e91e63';
  [[-6,-34],[0,-33],[6,-34]].forEach(([cx,cy]) => {
    ctx.beginPath(); ctx.arc(cx*s,cy*s,1.5*s,0,Math.PI*2); ctx.fill();
  });

  // Eyes
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(-4*s,-17*s,2*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4*s, -17*s,2*s,0,Math.PI*2); ctx.fill();

  // Smile
  ctx.strokeStyle = '#e91e63'; ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.arc(0,-13*s,4*s,0.1*Math.PI,0.9*Math.PI); ctx.stroke();

  // Legs
  const lf = opts.legFrame ?? 0;
  ctx.fillStyle = '#ffdab9';
  if (lf === 0) {
    ctx.fillRect(-7*s,24*s,5*s,12*s); ctx.fillRect(2*s, 24*s,5*s,12*s);
  } else {
    ctx.fillRect(-9*s,24*s,5*s,12*s); ctx.fillRect(4*s, 24*s,5*s,12*s);
  }
  ctx.fillStyle = '#ff1493';
  if (lf === 0) {
    ctx.fillRect(-8*s,35*s,7*s,3*s); ctx.fillRect(1*s, 35*s,7*s,3*s);
  } else {
    ctx.fillRect(-10*s,35*s,7*s,3*s); ctx.fillRect(3*s, 35*s,7*s,3*s);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─── Fish ────────────────────────────────────────────────────────
function updateFish(dt) {
  const bw = BANK_W(); const gy = GY();
  fish.forEach(f => {
    if (f.popping) {
      f.popY -= 80 * dt;
      if (f.popY < gy - 60) { f.popping = false; f.popTimer = 4 + Math.random() * 6; }
      return;
    }
    f.x += f.dir * f.spd * dt;
    if (f.x < bw+20 || f.x > W()-bw-20) f.dir *= -1;
    f.popTimer -= dt;
    if (f.popTimer <= 0) { f.popping = true; f.popY = GY() + 15; }
  });
}

function drawFish() {
  fish.forEach(f => {
    if (f.popping) {
      ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.fillText('🐟', f.x, f.popY);
    } else {
      ctx.fillStyle = 'rgba(100,180,255,0.3)';
      ctx.beginPath(); ctx.ellipse(f.x, f.y, 14, 7, 0, 0, Math.PI*2); ctx.fill();
    }
  });
}

// ─── Particles & Popups ──────────────────────────────────────────
function spawnJumpParticles(x, y) {
  const cols = ['#ffe082','#ff80ab','#80deea','#a5d6a7','#ce93d8'];
  for (let i = 0; i < 8; i++) {
    particles.push({ x, y, vx:(Math.random()-.5)*5, vy:-2-Math.random()*5, r:3+Math.random()*5, col:cols[Math.floor(Math.random()*cols.length)], life:1 });
  }
}

function spawnCelebrationParticles() {
  const cols = ['#ff4081','#ffd740','#40c4ff','#69f0ae','#ea80fc','#ffab40'];
  for (let i = 0; i < 25; i++) {
    particles.push({ x:W()/2+(Math.random()-.5)*W()*0.7, y:GY()-Math.random()*H()*0.45, vx:(Math.random()-.5)*4, vy:-1-Math.random()*3, r:4+Math.random()*8, col:cols[Math.floor(Math.random()*cols.length)], life:1.5 });
  }
}

function addPopup(text, x, y) { popups.push({ text, x, y, life:1.6 }); }

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=dt*0.7;
    if (p.life <= 0) particles.splice(i,1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function updatePopups(dt) {
  for (let i = popups.length-1; i >= 0; i--) {
    const p = popups[i]; p.y -= 35*dt; p.life -= dt;
    if (p.life <= 0) popups.splice(i,1);
  }
}

function drawPopups() {
  const s = Math.max(Math.min(W()/800,H()/450),0.7);
  ctx.font = `bold ${Math.round(30*s)}px 'Segoe UI',sans-serif`;
  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = '#fff'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// ─── HUD ─────────────────────────────────────────────────────────
function drawHUD() {
  const s = Math.max(Math.min(W()/800,H()/450),0.7);
  if (state === 'celebrating') return;

  // Title
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(22*s)}px 'Segoe UI',sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('👸 Princess Crosses the River!', W()/2, 36);

  // Progress dots
  const dotY = 62, dotSp = 28, n = BRICK_COUNT + 1;
  const x0 = W()/2 - (n-1)*dotSp/2;
  for (let i = 0; i < n; i++) {
    const done = i < currentBrick || state === 'walking_away';
    ctx.fillStyle = done ? '#ffe082' : 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.arc(x0 + i*dotSp, dotY, done ? 9 : 6, 0, Math.PI*2); ctx.fill();
    if (done) {
      ctx.fillStyle = '#f57f17';
      ctx.font = `bold ${Math.round(10*s)}px 'Segoe UI',sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('✓', x0 + i*dotSp, dotY + 4);
    }
  }

  // Bottom key prompt
  if (state === 'waiting' && currentBrick < BRICK_COUNT) {
    const letter = bricks[currentBrick].letter.toUpperCase();
    const pulse = 0.7 + 0.3 * Math.sin(time * 5);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#fff176';
    ctx.font = `bold ${Math.round(28*s)}px 'Segoe UI',sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`Press  [ ${letter} ]  to jump! 🦘`, W()/2, H() - 40);
    ctx.globalAlpha = 1;
  } else if (state === 'waiting' && currentBrick >= BRICK_COUNT) {
    const pulse = 0.65 + 0.35 * Math.sin(time * 4);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#80deea';
    ctx.font = `bold ${Math.round(24*s)}px 'Segoe UI',sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('🌈 Almost there!', W()/2, H() - 40);
    ctx.globalAlpha = 1;
  }
}

// ─── Title screen ────────────────────────────────────────────────
function drawTitle() {
  drawBackground();
  const s = Math.max(Math.min(W()/800,H()/450),0.7);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0,0,W(),H());

  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.round(50*s)}px 'Segoe UI',sans-serif`;
  ctx.strokeStyle = '#1565c0'; ctx.lineWidth = 3;
  ctx.strokeText('👸 Cross the River!', W()/2, H()*0.3);
  ctx.fillStyle = '#ffe082'; ctx.fillText('👸 Cross the River!', W()/2, H()*0.3);

  const bounce = Math.sin(time*3)*8;
  ctx.font = `bold ${Math.round(28*s)}px 'Segoe UI',sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.fillText('Press any key to start!', W()/2, H()*0.49 + bounce);

  ctx.font = `${Math.round(19*s)}px 'Segoe UI',sans-serif`;
  ctx.fillStyle = '#bbb';
  ctx.fillText('Press the right letter to jump to each brick!', W()/2, H()*0.61);

  drawPrincess(BANK_W()*0.5, GY()-PRINCESS_H, { legFrame: princess.legFrame });
}

// ─── Main draw ───────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,W(),H());

  if (state === 'title') { drawTitle(); return; }

  drawBackground();
  drawFish();
  drawBricks();
  drawParticles();

  // Draw princess (she may have walked off-screen in walking_away — that's intentional)
  const pOpts = {
    legFrame:  princess.legFrame,
    facingLeft: !princess.facingRight,
  };
  drawPrincess(princess.x, princess.y, pOpts);

  drawPopups();
  drawHUD();

  // Celebrate overlay
  if (state === 'celebrating') {
    const a = 0.1 + 0.08*Math.sin(time*6);
    ctx.fillStyle = `rgba(255,240,100,${a})`;
    ctx.fillRect(0,0,W(),H());

    const s = Math.max(Math.min(W()/800,H()/450),0.7);
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(54*s)}px 'Segoe UI',sans-serif`;
    ctx.strokeStyle = '#e65100'; ctx.lineWidth = 4;
    ctx.strokeText('🌈 She made it! 🌈', W()/2, H()*0.38);
    ctx.fillStyle = '#fffde7'; ctx.fillText('🌈 She made it! 🌈', W()/2, H()*0.38);

    ctx.font = `bold ${Math.round(26*s)}px 'Segoe UI',sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('Playing again soon… 🌸', W()/2, H()*0.48);
  }
}

// ─── Input ───────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const key = e.key.toLowerCase();

  if (state === 'title') {
    e.preventDefault();
    initScene(); state = 'intro'; return;
  }
  if (state === 'celebrating') {
    e.preventDefault();
    initScene(); state = 'intro'; return;
  }
  if (state !== 'waiting') return;
  if (currentBrick >= BRICK_COUNT) return;   // auto-jump handles the rest

  e.preventDefault();
  const expected = bricks[currentBrick].letter;
  if (key === expected) {
    const brickIdx = currentBrick;
    currentBrick++;
    startJump(brickIdx);
  } else if (key.length === 1) {
    addPopup(`Try  [ ${expected.toUpperCase()} ]`, W()/2, GY() - 130);
  }
});

// ─── Loop ────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

initScene();
requestAnimationFrame(loop);
</script>
</body>
