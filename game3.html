<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Princess Crosses the River!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; }
canvas { display: block; margin: 0 auto; }
#back-btn {
  position: absolute;
  top: 12px; left: 12px;
  background: rgba(255,255,255,0.9);
  border: 3px solid #e91e63;
  border-radius: 12px;
  padding: 8px 18px;
  font-size: 20px;
  font-weight: bold;
  color: #e91e63;
  cursor: pointer;
  text-decoration: none;
  z-index: 10;
  font-family: 'Segoe UI', sans-serif;
}
#back-btn:hover { background: #fce4ec; }
</style>
</head>
<body>
<a id="back-btn" href="index.html">← Home</a>
<canvas id="c"></canvas>
<script>
// ================================================================
//  Princess Crosses the River — Kids Typing Game
// ================================================================

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); initScene(); });

function W()      { return canvas.width; }
function H()      { return canvas.height; }
function GY()     { return H() * 0.68; }        // water surface Y
function BANK_W() { return W() * 0.18; }

const BRICK_COUNT = 5;
const BRICK_H     = 24;
const BRICK_W     = 64;
const PRINCESS_H  = 40;   // distance from princess.y to her feet (approx)

// ─── Random letters ─────────────────────────────────────────────
function randomLetters(n) {
  const pool = 'abcdefghijklmnopqrstuvwxyz'.split('');
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, n);
}

// ─── Random 4-digit numbers (no repeated digits within each number) ──
function random4DigitNumbers(n) {
  const results = [];
  for (let k = 0; k < n; k++) {
    const digits = '0123456789'.split('');
    for (let i = digits.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [digits[i], digits[j]] = [digits[j], digits[i]];
    }
    // Ensure first digit is not 0 for a nicer looking number
    let picked = digits.slice(0, 4);
    if (picked[0] === '0') {
      // swap with first non-zero
      for (let i = 1; i < picked.length; i++) {
        if (picked[i] !== '0') { [picked[0], picked[i]] = [picked[i], picked[0]]; break; }
      }
    }
    results.push(picked.join(''));
  }
  return results;
}

// ─── State ──────────────────────────────────────────────────────
// States: level_select | intro | waiting | jumping | jumping_bank | walking_away | celebrating
let state         = 'level_select';
let level         = 1;           // 1 = letters, 2 = numbers
let bricks        = [];
let currentBrick  = 0;
let princess      = {};
let particles     = [];
let popups        = [];
let waveOffset    = 0;
let fish          = [];
let clouds        = [];
let time          = 0;
let resetTimer    = 0;
let autoJumpTimer = 0;

// Number level state
let typedDigits   = [];
let targetNumber  = '';
let wrongFlash    = 0;           // countdown for red flash on wrong digit
let wrongFlashIdx = -1;          // which box index flashed

// Jump animation state
let jumpStartX, jumpStartY, jumpTargetX, jumpTargetY, jumpProgress, jumpDuration;
let jumpToBrickIdx = -1;

// Level select hover tracking
let hoverCard = 0; // 0 = none, 1 = left card, 2 = right card

// ─── Init / reset ───────────────────────────────────────────────
function initScene() {
  const gy     = GY();
  const bw     = BANK_W();
  const riverW = W() - bw * 2;
  const spacing = riverW / (BRICK_COUNT + 1);
  const letters = randomLetters(BRICK_COUNT);
  const numbers = random4DigitNumbers(BRICK_COUNT);

  bricks = [];
  for (let i = 0; i < BRICK_COUNT; i++) {
    const bx = bw + spacing * (i + 1);
    const baseY = gy - BRICK_H - 18;
    bricks.push({
      x: bx,
      baseY,
      y: baseY,
      letter: letters[i],
      number: numbers[i],
      phase: Math.random() * Math.PI * 2,
    });
  }

  princess = {
    x: -50,
    y: gy - PRINCESS_H,
    facingRight: true,
    legFrame: 0,
    legTimer: 0,
  };

  currentBrick  = 0;
  particles     = [];
  popups        = [];
  autoJumpTimer = 0;
  resetTimer    = 0;
  jumpToBrickIdx = -1;
  typedDigits   = [];
  targetNumber  = '';
  wrongFlash    = 0;
  wrongFlashIdx = -1;

  // Set first target number if in number mode
  if (level === 2 && bricks.length > 0) {
    targetNumber = bricks[0].number;
  }

  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x: Math.random() * W(),
      y: 30 + Math.random() * GY() * 0.35,
      w: 70 + Math.random() * 90,
      h: 25 + Math.random() * 18,
      spd: 0.25 + Math.random() * 0.3,
    });
  }

  fish = [];
  for (let i = 0; i < 4; i++) {
    fish.push({
      x: BANK_W() + Math.random() * (W() - BANK_W() * 2),
      y: GY() + 28 + Math.random() * 40,
      dir: Math.random() < 0.5 ? 1 : -1,
      spd: 18 + Math.random() * 22,
      popTimer: 3 + Math.random() * 7,
      popping: false,
      popY: 0,
    });
  }
}

// ─── Jump logic ──────────────────────────────────────────────────
function startJump(targetBrickIdx) {
  jumpStartX    = princess.x;
  jumpStartY    = princess.y;
  jumpToBrickIdx = targetBrickIdx;

  if (targetBrickIdx >= 0) {
    const b = bricks[targetBrickIdx];
    jumpTargetX = b.x;
    jumpTargetY = b.y - PRINCESS_H + 2;
    jumpDuration = 0.52;
    state = 'jumping';
  } else {
    jumpTargetX = W() - BANK_W() * 0.55;
    jumpTargetY = GY() - PRINCESS_H;
    jumpDuration = 0.65;
    state = 'jumping_bank';
  }

  jumpProgress = 0;
  princess.facingRight = jumpTargetX > princess.x;
  spawnJumpParticles(princess.x, princess.y);
}

function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }

function jumpXY(t) {
  const ex  = easeInOut(t);
  const arc = Math.sin(Math.PI * t);
  const maxArc = Math.min(GY() * 0.38, 200);
  return {
    x: jumpStartX + (jumpTargetX - jumpStartX) * ex,
    y: jumpStartY + (jumpTargetY - jumpStartY) * ex - arc * maxArc,
  };
}

// ─── Update ──────────────────────────────────────────────────────
function update(dt) {
  time       += dt;
  waveOffset += dt * 28;

  // Clouds drift
  for (const cl of clouds) {
    cl.x -= cl.spd;
    if (cl.x + cl.w < 0) { cl.x = W() + 20; cl.y = 30 + Math.random() * GY() * 0.35; }
  }

  // Brick bobbing (always)
  for (const b of bricks) {
    b.y = b.baseY + Math.sin(time * 1.8 + b.phase) * 5;
  }

  updateFish(dt);
  updateParticles(dt);
  updatePopups(dt);

  // Wrong flash countdown
  if (wrongFlash > 0) wrongFlash -= dt;

  // Leg animation
  if (state !== 'level_select') {
    princess.legTimer += dt;
    if (princess.legTimer > 0.15) { princess.legFrame = 1 - princess.legFrame; princess.legTimer = 0; }
  }

  // ── State machine ──────────────────────────────────────────────

  if (state === 'intro') {
    const targetX = BANK_W() - 14;
    const dx = targetX - princess.x;
    princess.y = GY() - PRINCESS_H;
    if (Math.abs(dx) < 2) {
      princess.x = targetX;
      state = 'waiting';
      // Set up first target for number level
      if (level === 2 && currentBrick < BRICK_COUNT) {
        targetNumber = bricks[currentBrick].number;
        typedDigits = [];
      }
    } else {
      princess.x += Math.min(dx, 110 * dt);
    }

  } else if (state === 'jumping') {
    jumpProgress += dt / jumpDuration;
    if (jumpProgress >= 1) {
      const b = bricks[jumpToBrickIdx];
      princess.x = b.x;
      princess.y = b.y - PRINCESS_H + 2;
      spawnJumpParticles(princess.x, princess.y - 10);

      if (level === 1) {
        addPopup('\u2B50 ' + bricks[jumpToBrickIdx].letter.toUpperCase() + '!',
                 princess.x, princess.y - 55);
      } else {
        addPopup('\u2B50 ' + bricks[jumpToBrickIdx].number + '!',
                 princess.x, princess.y - 55);
      }

      if (jumpToBrickIdx === BRICK_COUNT - 1) {
        autoJumpTimer = 0.7;
        addPopup('\uD83C\uDF1F Last one!', princess.x, princess.y - 80);
      }
      state = 'waiting';

      // Prepare next target for number level
      if (level === 2 && currentBrick < BRICK_COUNT) {
        targetNumber = bricks[currentBrick].number;
        typedDigits = [];
      }
    } else {
      const pos = jumpXY(jumpProgress);
      princess.x = pos.x;
      princess.y = pos.y;
    }

  } else if (state === 'jumping_bank') {
    jumpProgress += dt / jumpDuration;
    if (jumpProgress >= 1) {
      princess.x = jumpTargetX;
      princess.y = jumpTargetY;
      spawnJumpParticles(princess.x, princess.y - 10);
      state = 'walking_away';
    } else {
      const pos = jumpXY(jumpProgress);
      princess.x = pos.x;
      princess.y = pos.y;
    }

  } else if (state === 'waiting') {
    if (currentBrick > 0 && currentBrick <= BRICK_COUNT) {
      const b = bricks[currentBrick - 1];
      princess.y = b.y - PRINCESS_H + 2;
    } else if (currentBrick === 0) {
      princess.y = GY() - PRINCESS_H;
    }

    if (currentBrick >= BRICK_COUNT && autoJumpTimer > 0) {
      autoJumpTimer -= dt;
      if (autoJumpTimer <= 0) {
        startJump(-1);
      }
    }

  } else if (state === 'walking_away') {
    princess.x += 100 * dt;
    princess.y  = GY() - PRINCESS_H;
    princess.facingRight = true;
    if (princess.x > W() + 80) {
      state = 'celebrating';
      resetTimer = 0;
      spawnCelebrationParticles();
      addPopup('\uD83C\uDF89 She made it! \uD83C\uDF89', W() * 0.65, GY() - 80);
    }

  } else if (state === 'celebrating') {
    resetTimer += dt;
    if (Math.random() < 0.12) spawnCelebrationParticles();
    if (resetTimer > 3.5) {
      initScene();
      state = 'intro';
    }
  }
}

// ─── Drawing helpers ─────────────────────────────────────────────
function roundRect(x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);   ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);   ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);     ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath(); ctx.fill();
}

function roundRectStroke(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);   ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);   ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);     ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ─── Background ──────────────────────────────────────────────────
function drawBackground() {
  const gy = GY();
  const bw = BANK_W();

  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, '#1a1a5e');
  sky.addColorStop(0.6, '#2e5fa3');
  sky.addColorStop(1, '#87ceeb');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W(), gy);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 25; i++) {
    const sx = (i * 173 + 30) % W();
    const sy = (i * 89 + 10)  % (gy * 0.45);
    ctx.beginPath(); ctx.arc(sx, sy, 1 + (i % 2), 0, Math.PI*2); ctx.fill();
  }

  // Clouds
  for (const cl of clouds) {
    roundRect(cl.x, cl.y, cl.w, cl.h, cl.h/2, 'rgba(255,255,255,0.22)');
    roundRect(cl.x + cl.w*0.2, cl.y - cl.h*0.3, cl.w*0.55, cl.h*0.6, cl.h*0.3, 'rgba(255,255,255,0.18)');
  }

  // River water
  const water = ctx.createLinearGradient(0, gy, 0, H());
  water.addColorStop(0, '#1e90ff');
  water.addColorStop(0.4, '#1565c0');
  water.addColorStop(1, '#0d47a1');
  ctx.fillStyle = water;
  ctx.fillRect(bw, gy, W() - bw*2, H() - gy);

  // Water shimmer
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5;
  for (let row = 0; row < 6; row++) {
    const wy = gy + 18 + row * 22;
    for (let col = 0; col < 8; col++) {
      const segW = (W() - bw*2) / 8;
      const wx = bw + col * segW + ((waveOffset * (row%2===0?1:-1) * 0.6)) % segW;
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.bezierCurveTo(wx+12, wy-4, wx+24, wy+4, wx+36, wy);
      ctx.stroke();
    }
  }

  // Banks
  const bankGrad = ctx.createLinearGradient(0, gy - 6, 0, H());
  bankGrad.addColorStop(0, '#4caf50');
  bankGrad.addColorStop(0.25, '#388e3c');
  bankGrad.addColorStop(1, '#1b5e20');
  ctx.fillStyle = bankGrad;
  ctx.fillRect(0, gy, bw + 6, H() - gy);
  ctx.fillRect(W() - bw - 6, gy, bw + 6, H() - gy);
  ctx.fillStyle = '#66bb6a';
  ctx.fillRect(0, gy - 8, bw + 6, 10);
  ctx.fillRect(W() - bw - 6, gy - 8, bw + 6, 10);

  // Grass tufts
  ctx.fillStyle = '#81c784';
  for (let i = 0; i < 10; i++) {
    drawGrassTuft((i*23+5) % (bw - 10), gy - 6);
    drawGrassTuft(W() - bw + (i*23+8) % (bw - 10), gy - 6);
  }

  // Goal marker on right bank
  drawGoal(W() - bw * 0.5, gy - 14);
}

function drawGrassTuft(x, y) {
  ctx.beginPath(); ctx.moveTo(x-4,y); ctx.lineTo(x,y-10); ctx.lineTo(x+4,y); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+2,y); ctx.lineTo(x+6,y-7); ctx.lineTo(x+9,y); ctx.closePath(); ctx.fill();
}

function drawGoal(x, y) {
  ctx.font = '30px serif'; ctx.textAlign = 'center';
  ['\uD83C\uDF38','\uD83C\uDF3A','\uD83C\uDF3B'].forEach((f,i) => ctx.fillText(f, x + (i-1)*26, y));
  const r = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6'];
  r.forEach((col,i) => {
    ctx.strokeStyle = col; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(x, y + 8, 34 + i*5, Math.PI, 0, false); ctx.stroke();
  });
}

// ─── Bricks ──────────────────────────────────────────────────────
function drawBricks() {
  const s = Math.max(Math.min(W()/800, H()/450), 0.7);

  bricks.forEach((b, i) => {
    const isCurrent = (i === currentBrick && (state === 'waiting' || state === 'jumping'));
    const isPassed  = i < currentBrick;

    const brickTop = b.y;

    // Glow ring for current target
    if (isCurrent) {
      const pulse = 0.5 + 0.5 * Math.abs(Math.sin(time * 5));
      ctx.strokeStyle = `rgba(255,230,0,${pulse})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(b.x, brickTop + BRICK_H + 4, BRICK_W/2 + 14, 10, 0, 0, Math.PI*2);
      ctx.stroke();
    }

    // Brick body
    const col = isPassed ? '#546e7a' : isCurrent ? '#8d6e63' : '#6d4c41';
    roundRect(b.x - BRICK_W/2, brickTop, BRICK_W, BRICK_H, 6, col);

    // Mortar lines
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(b.x - BRICK_W/2, brickTop + BRICK_H/2); ctx.lineTo(b.x + BRICK_W/2, brickTop + BRICK_H/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x, brickTop); ctx.lineTo(b.x, brickTop + BRICK_H/2); ctx.stroke();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(b.x - BRICK_W/2 + 4, brickTop + 3, BRICK_W - 8, 5);

    // Moss on unpassed bricks
    if (!isPassed) {
      ctx.fillStyle = '#66bb6a';
      for (let m = 0; m < 3; m++) {
        ctx.beginPath(); ctx.arc(b.x - 18 + m*18, brickTop + 1, 4, Math.PI, 0); ctx.fill();
      }
    }

    // Label above brick
    if (!isPassed) {
      if (level === 1) {
        // ── Letter mode ──
        const letter = b.letter.toUpperCase();
        if (isCurrent) {
          const bounce = Math.sin(time * 6) * 5;
          const cap    = Math.round(36 * s);
          const lx     = b.x - cap/2;
          const ly     = brickTop - cap - 14 + bounce;

          ctx.fillStyle = 'rgba(0,0,0,0.22)';
          roundRect(lx+3, ly+5, cap, cap, 9, 'rgba(0,0,0,0.18)');
          roundRect(lx, ly, cap, cap, 9, '#fff176');
          ctx.strokeStyle = '#f9a825'; ctx.lineWidth = 2.5;
          roundRectStroke(lx, ly, cap, cap, 9); ctx.stroke();
          ctx.fillStyle = '#e65100';
          ctx.font = `bold ${Math.round(23*s)}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(letter, b.x, ly + cap * 0.72);
          ctx.fillStyle = '#fff176';
          ctx.beginPath();
          ctx.moveTo(b.x-7, ly+cap+1); ctx.lineTo(b.x+7, ly+cap+1); ctx.lineTo(b.x, ly+cap+12);
          ctx.closePath(); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          ctx.font = `bold ${Math.round(16*s)}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(letter, b.x, brickTop - 10);
        }
      } else {
        // ── Number mode ──
        const num = b.number;
        if (isCurrent) {
          const bounce = Math.sin(time * 6) * 5;
          const capW   = Math.round(90 * s);
          const capH   = Math.round(38 * s);
          const lx     = b.x - capW/2;
          const ly     = brickTop - capH - 16 + bounce;

          // Shadow
          roundRect(lx+3, ly+5, capW, capH, 11, 'rgba(0,0,0,0.18)');
          // Background box
          roundRect(lx, ly, capW, capH, 11, '#fff176');
          ctx.strokeStyle = '#f9a825'; ctx.lineWidth = 2.5;
          roundRectStroke(lx, ly, capW, capH, 11); ctx.stroke();
          // Number text
          ctx.fillStyle = '#e65100';
          ctx.font = `bold ${Math.round(22*s)}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(num, b.x, ly + capH * 0.68);
          // Arrow
          ctx.fillStyle = '#fff176';
          ctx.beginPath();
          ctx.moveTo(b.x-7, ly+capH+1); ctx.lineTo(b.x+7, ly+capH+1); ctx.lineTo(b.x, ly+capH+12);
          ctx.closePath(); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.font = `bold ${Math.round(13*s)}px 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(num, b.x, brickTop - 10);
        }
      }
    } else if (level === 2) {
      // Passed brick in number mode: show greyed out
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.font = `${Math.round(11*s)}px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(b.number, b.x, brickTop - 6);
    }
  });
}

// ─── Princess ────────────────────────────────────────────────────
function drawPrincess(px, py, opts = {}) {
  const s    = Math.max(Math.min(W()/800, H()/450), 0.7);
  const flip = opts.facingLeft ? -1 : 1;
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(flip, 1);
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;

  // Dress
  ctx.fillStyle = '#ff69b4';
  ctx.fillRect(-12*s, -5*s, 24*s, 30*s);
  ctx.fillStyle = '#ff85c8';
  ctx.beginPath();
  ctx.moveTo(-14*s,25*s); ctx.lineTo(14*s,25*s); ctx.lineTo(10*s,10*s); ctx.lineTo(-10*s,10*s);
  ctx.closePath(); ctx.fill();

  // Head
  ctx.fillStyle = '#ffdab9';
  ctx.beginPath(); ctx.arc(0, -16*s, 10*s, 0, Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(-11*s,-26*s,22*s,8*s);
  ctx.fillRect(-12*s,-20*s,4*s,18*s);
  ctx.fillRect(8*s,  -20*s,4*s,18*s);

  // Crown
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(-8*s,-30*s,16*s,5*s);
  [[-8,-38],[0,-36],[8,-38]].forEach(([tx,ty]) => {
    ctx.beginPath(); ctx.moveTo((tx-2)*s,-30*s); ctx.lineTo(tx*s,ty*s); ctx.lineTo((tx+2)*s,-30*s); ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle = '#e91e63';
  [[-6,-34],[0,-33],[6,-34]].forEach(([cx,cy]) => {
    ctx.beginPath(); ctx.arc(cx*s,cy*s,1.5*s,0,Math.PI*2); ctx.fill();
  });

  // Eyes
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(-4*s,-17*s,2*s,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4*s, -17*s,2*s,0,Math.PI*2); ctx.fill();

  // Smile
  ctx.strokeStyle = '#e91e63'; ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.arc(0,-13*s,4*s,0.1*Math.PI,0.9*Math.PI); ctx.stroke();

  // Legs
  const lf = opts.legFrame ?? 0;
  ctx.fillStyle = '#ffdab9';
  if (lf === 0) {
    ctx.fillRect(-7*s,24*s,5*s,12*s); ctx.fillRect(2*s, 24*s,5*s,12*s);
  } else {
    ctx.fillRect(-9*s,24*s,5*s,12*s); ctx.fillRect(4*s, 24*s,5*s,12*s);
  }
  ctx.fillStyle = '#ff1493';
  if (lf === 0) {
    ctx.fillRect(-8*s,35*s,7*s,3*s); ctx.fillRect(1*s, 35*s,7*s,3*s);
  } else {
    ctx.fillRect(-10*s,35*s,7*s,3*s); ctx.fillRect(3*s, 35*s,7*s,3*s);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─── Fish ────────────────────────────────────────────────────────
function updateFish(dt) {
  const bw = BANK_W(); const gy = GY();
  fish.forEach(f => {
    if (f.popping) {
      f.popY -= 80 * dt;
      if (f.popY < gy - 60) { f.popping = false; f.popTimer = 4 + Math.random() * 6; }
      return;
    }
    f.x += f.dir * f.spd * dt;
    if (f.x < bw+20 || f.x > W()-bw-20) f.dir *= -1;
    f.popTimer -= dt;
    if (f.popTimer <= 0) { f.popping = true; f.popY = GY() + 15; }
  });
}

function drawFish() {
  fish.forEach(f => {
    if (f.popping) {
      ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.fillText('\uD83D\uDC1F', f.x, f.popY);
    } else {
      ctx.fillStyle = 'rgba(100,180,255,0.3)';
      ctx.beginPath(); ctx.ellipse(f.x, f.y, 14, 7, 0, 0, Math.PI*2); ctx.fill();
    }
  });
}

// ─── Particles & Popups ──────────────────────────────────────────
function spawnJumpParticles(x, y) {
  const cols = ['#ffe082','#ff80ab','#80deea','#a5d6a7','#ce93d8'];
  for (let i = 0; i < 8; i++) {
    particles.push({ x, y, vx:(Math.random()-.5)*5, vy:-2-Math.random()*5, r:3+Math.random()*5, col:cols[Math.floor(Math.random()*cols.length)], life:1 });
  }
}

function spawnCelebrationParticles() {
  const cols = ['#ff4081','#ffd740','#40c4ff','#69f0ae','#ea80fc','#ffab40'];
  for (let i = 0; i < 25; i++) {
    particles.push({ x:W()/2+(Math.random()-.5)*W()*0.7, y:GY()-Math.random()*H()*0.45, vx:(Math.random()-.5)*4, vy:-1-Math.random()*3, r:4+Math.random()*8, col:cols[Math.floor(Math.random()*cols.length)], life:1.5 });
  }
}

function addPopup(text, x, y) { popups.push({ text, x, y, life:1.6 }); }

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=dt*0.7;
    if (p.life <= 0) particles.splice(i,1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function updatePopups(dt) {
  for (let i = popups.length-1; i >= 0; i--) {
    const p = popups[i]; p.y -= 35*dt; p.life -= dt;
    if (p.life <= 0) popups.splice(i,1);
  }
}

function drawPopups() {
  const s = Math.max(Math.min(W()/800,H()/450),0.7);
  ctx.font = `bold ${Math.round(30*s)}px 'Segoe UI',sans-serif`;
  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.strokeStyle = '#333'; ctx.lineWidth = 3; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = '#fff'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// ─── Typing Display (Number Level) ─────────────────────────────
function drawTypingDisplay() {
  if (level !== 2) return;
  if (state !== 'waiting') return;
  if (currentBrick >= BRICK_COUNT) return;

  const s = Math.max(Math.min(W()/800, H()/450), 0.7);
  const boxSize = Math.round(48 * s);
  const gap = Math.round(12 * s);
  const totalW = boxSize * 4 + gap * 3;
  const startX = W()/2 - totalW/2;
  const baseY  = H() - 30 - boxSize;

  // Background panel
  roundRect(startX - 16, baseY - 12, totalW + 32, boxSize + 24, 14, 'rgba(0,0,0,0.45)');

  for (let i = 0; i < 4; i++) {
    const bx = startX + i * (boxSize + gap);
    const by = baseY;
    const isTyped = i < typedDigits.length;
    const isWrongFlash = (wrongFlash > 0 && wrongFlashIdx === i);

    // Box background
    let boxColor;
    if (isWrongFlash) {
      boxColor = '#ef5350'; // red flash
    } else if (isTyped) {
      boxColor = '#66bb6a'; // green for correct
    } else {
      boxColor = 'rgba(255,255,255,0.15)';
    }
    roundRect(bx, by, boxSize, boxSize, 10, boxColor);

    // Border
    ctx.strokeStyle = isTyped ? '#43a047' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2.5;
    roundRectStroke(bx, by, boxSize, boxSize, 10);
    ctx.stroke();

    // Content
    ctx.textAlign = 'center';
    if (isTyped) {
      // Show typed digit with checkmark
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(26*s)}px 'Segoe UI', sans-serif`;
      ctx.fillText(typedDigits[i], bx + boxSize/2, by + boxSize * 0.58);
      // Small checkmark
      ctx.fillStyle = '#c8e6c9';
      ctx.font = `bold ${Math.round(12*s)}px 'Segoe UI', sans-serif`;
      ctx.fillText('\u2713', bx + boxSize - 10, by + 14);
    } else {
      // Underscore placeholder
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = `bold ${Math.round(26*s)}px 'Segoe UI', sans-serif`;
      ctx.fillText('_', bx + boxSize/2, by + boxSize * 0.58);
    }
  }

  // Label above
  ctx.fillStyle = '#fff176';
  ctx.font = `bold ${Math.round(16*s)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('Type the number:', W()/2, baseY - 20);
}

// ─── HUD ─────────────────────────────────────────────────────────
function drawHUD() {
  const s = Math.max(Math.min(W()/800,H()/450),0.7);
  if (state === 'celebrating') return;

  // Title
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(22*s)}px 'Segoe UI',sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('\uD83D\uDC78 Princess Crosses the River!', W()/2, 36);

  // Level indicator
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = `${Math.round(14*s)}px 'Segoe UI',sans-serif`;
  ctx.fillText(level === 1 ? 'Level 1: Letters' : 'Level 2: Numbers', W()/2, 56);

  // Progress dots
  const dotY = 76, dotSp = 28, n = BRICK_COUNT + 1;
  const x0 = W()/2 - (n-1)*dotSp/2;
  for (let i = 0; i < n; i++) {
    const done = i < currentBrick || state === 'walking_away';
    ctx.fillStyle = done ? '#ffe082' : 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.arc(x0 + i*dotSp, dotY, done ? 9 : 6, 0, Math.PI*2); ctx.fill();
    if (done) {
      ctx.fillStyle = '#f57f17';
      ctx.font = `bold ${Math.round(10*s)}px 'Segoe UI',sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('\u2713', x0 + i*dotSp, dotY + 4);
    }
  }

  // Bottom key prompt (only for letter level; number level uses typing display)
  if (level === 1) {
    if (state === 'waiting' && currentBrick < BRICK_COUNT) {
      const letter = bricks[currentBrick].letter.toUpperCase();
      const pulse = 0.7 + 0.3 * Math.sin(time * 5);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#fff176';
      ctx.font = `bold ${Math.round(28*s)}px 'Segoe UI',sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`Press  [ ${letter} ]  to jump! \uD83E\uDD98`, W()/2, H() - 40);
      ctx.globalAlpha = 1;
    } else if (state === 'waiting' && currentBrick >= BRICK_COUNT) {
      const pulse = 0.65 + 0.35 * Math.sin(time * 4);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#80deea';
      ctx.font = `bold ${Math.round(24*s)}px 'Segoe UI',sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('\uD83C\uDF08 Almost there!', W()/2, H() - 40);
      ctx.globalAlpha = 1;
    }
  } else {
    // Number level: "almost there" prompt when on last brick
    if (state === 'waiting' && currentBrick >= BRICK_COUNT) {
      const pulse = 0.65 + 0.35 * Math.sin(time * 4);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#80deea';
      ctx.font = `bold ${Math.round(24*s)}px 'Segoe UI',sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('\uD83C\uDF08 Almost there!', W()/2, H() - 100);
      ctx.globalAlpha = 1;
    }
  }
}

// ─── Level Select Screen ─────────────────────────────────────────
function drawLevelSelect() {
  drawBackground();
  const s = Math.max(Math.min(W()/800, H()/450), 0.7);

  // Dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W(), H());

  // Title
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.round(50*s)}px 'Segoe UI', sans-serif`;
  ctx.strokeStyle = '#1565c0'; ctx.lineWidth = 3;
  ctx.strokeText('\uD83D\uDC78 Cross the River!', W()/2, H()*0.18);
  ctx.fillStyle = '#ffe082';
  ctx.fillText('\uD83D\uDC78 Cross the River!', W()/2, H()*0.18);

  // Subtitle
  ctx.font = `${Math.round(20*s)}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = '#ccc';
  ctx.fillText('Choose a level:', W()/2, H()*0.26);

  // Card dimensions
  const cardW = Math.round(Math.min(240 * s, W() * 0.35));
  const cardH = Math.round(Math.min(260 * s, H() * 0.45));
  const gap   = Math.round(40 * s);
  const card1X = W()/2 - cardW - gap/2;
  const card2X = W()/2 + gap/2;
  const cardY  = H() * 0.32;

  // ── Card 1: Letters ──
  const hover1 = hoverCard === 1;
  const c1Scale = hover1 ? 1.04 : 1;
  ctx.save();
  ctx.translate(card1X + cardW/2, cardY + cardH/2);
  ctx.scale(c1Scale, c1Scale);
  ctx.translate(-(card1X + cardW/2), -(cardY + cardH/2));

  // Card background
  const c1Grad = ctx.createLinearGradient(card1X, cardY, card1X, cardY + cardH);
  c1Grad.addColorStop(0, '#4fc3f7');
  c1Grad.addColorStop(1, '#0288d1');
  roundRect(card1X, cardY, cardW, cardH, 20, c1Grad.toString ? '#4fc3f7' : '#4fc3f7');
  // Actually draw gradient
  ctx.fillStyle = c1Grad;
  ctx.beginPath();
  ctx.moveTo(card1X+20, cardY);
  ctx.lineTo(card1X+cardW-20, cardY); ctx.quadraticCurveTo(card1X+cardW, cardY, card1X+cardW, cardY+20);
  ctx.lineTo(card1X+cardW, cardY+cardH-20); ctx.quadraticCurveTo(card1X+cardW, cardY+cardH, card1X+cardW-20, cardY+cardH);
  ctx.lineTo(card1X+20, cardY+cardH); ctx.quadraticCurveTo(card1X, cardY+cardH, card1X, cardY+cardH-20);
  ctx.lineTo(card1X, cardY+20); ctx.quadraticCurveTo(card1X, cardY, card1X+20, cardY);
  ctx.closePath(); ctx.fill();

  // Glow border on hover
  if (hover1) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    roundRectStroke(card1X, cardY, cardW, cardH, 20); ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
    roundRectStroke(card1X, cardY, cardW, cardH, 20); ctx.stroke();
  }

  // Big ABC text
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(52*s)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('ABC', card1X + cardW/2, cardY + cardH * 0.35);

  // Label
  ctx.font = `bold ${Math.round(26*s)}px 'Segoe UI', sans-serif`;
  ctx.fillText('Letters', card1X + cardW/2, cardY + cardH * 0.55);

  // Subtitle
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = `${Math.round(14*s)}px 'Segoe UI', sans-serif`;
  ctx.fillText('Press one letter per brick', card1X + cardW/2, cardY + cardH * 0.68);

  // Key hint
  const bounce1 = Math.sin(time * 3) * 4;
  ctx.fillStyle = '#ffe082';
  ctx.font = `bold ${Math.round(20*s)}px 'Segoe UI', sans-serif`;
  ctx.fillText('Press  [ 1 ]', card1X + cardW/2, cardY + cardH * 0.85 + bounce1);

  ctx.restore();

  // ── Card 2: Numbers ──
  const hover2 = hoverCard === 2;
  const c2Scale = hover2 ? 1.04 : 1;
  ctx.save();
  ctx.translate(card2X + cardW/2, cardY + cardH/2);
  ctx.scale(c2Scale, c2Scale);
  ctx.translate(-(card2X + cardW/2), -(cardY + cardH/2));

  // Card background
  const c2Grad = ctx.createLinearGradient(card2X, cardY, card2X, cardY + cardH);
  c2Grad.addColorStop(0, '#ce93d8');
  c2Grad.addColorStop(1, '#7b1fa2');
  ctx.fillStyle = c2Grad;
  ctx.beginPath();
  ctx.moveTo(card2X+20, cardY);
  ctx.lineTo(card2X+cardW-20, cardY); ctx.quadraticCurveTo(card2X+cardW, cardY, card2X+cardW, cardY+20);
  ctx.lineTo(card2X+cardW, cardY+cardH-20); ctx.quadraticCurveTo(card2X+cardW, cardY+cardH, card2X+cardW-20, cardY+cardH);
  ctx.lineTo(card2X+20, cardY+cardH); ctx.quadraticCurveTo(card2X, cardY+cardH, card2X, cardY+cardH-20);
  ctx.lineTo(card2X, cardY+20); ctx.quadraticCurveTo(card2X, cardY, card2X+20, cardY);
  ctx.closePath(); ctx.fill();

  if (hover2) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    roundRectStroke(card2X, cardY, cardW, cardH, 20); ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
    roundRectStroke(card2X, cardY, cardW, cardH, 20); ctx.stroke();
  }

  // Big 1234 text
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(46*s)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('1234', card2X + cardW/2, cardY + cardH * 0.35);

  // Label
  ctx.font = `bold ${Math.round(26*s)}px 'Segoe UI', sans-serif`;
  ctx.fillText('Numbers', card2X + cardW/2, cardY + cardH * 0.55);

  // Subtitle
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = `${Math.round(14*s)}px 'Segoe UI', sans-serif`;
  ctx.fillText('Type a 4-digit number per brick', card2X + cardW/2, cardY + cardH * 0.68);

  // Key hint
  const bounce2 = Math.sin(time * 3 + 1) * 4;
  ctx.fillStyle = '#ffe082';
  ctx.font = `bold ${Math.round(20*s)}px 'Segoe UI', sans-serif`;
  ctx.fillText('Press  [ 2 ]', card2X + cardW/2, cardY + cardH * 0.85 + bounce2);

  ctx.restore();

  // Princess at bottom
  drawPrincess(BANK_W()*0.5, GY()-PRINCESS_H, { legFrame: princess.legFrame });

  // Store card bounds for click detection
  drawLevelSelect._card1 = { x: card1X, y: cardY, w: cardW, h: cardH };
  drawLevelSelect._card2 = { x: card2X, y: cardY, w: cardW, h: cardH };
}

// ─── Main draw ───────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,W(),H());

  if (state === 'level_select') { drawLevelSelect(); return; }

  drawBackground();
  drawFish();
  drawBricks();
  drawParticles();

  const pOpts = {
    legFrame:  princess.legFrame,
    facingLeft: !princess.facingRight,
  };
  drawPrincess(princess.x, princess.y, pOpts);

  drawPopups();
  drawHUD();
  drawTypingDisplay();

  // Celebrate overlay
  if (state === 'celebrating') {
    const a = 0.1 + 0.08*Math.sin(time*6);
    ctx.fillStyle = `rgba(255,240,100,${a})`;
    ctx.fillRect(0,0,W(),H());

    const s = Math.max(Math.min(W()/800,H()/450),0.7);
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(54*s)}px 'Segoe UI',sans-serif`;
    ctx.strokeStyle = '#e65100'; ctx.lineWidth = 4;
    ctx.strokeText('\uD83C\uDF08 She made it! \uD83C\uDF08', W()/2, H()*0.38);
    ctx.fillStyle = '#fffde7'; ctx.fillText('\uD83C\uDF08 She made it! \uD83C\uDF08', W()/2, H()*0.38);

    ctx.font = `bold ${Math.round(26*s)}px 'Segoe UI',sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('Playing again soon\u2026 \uD83C\uDF38', W()/2, H()*0.48);
  }
}

// ─── Input ───────────────────────────────────────────────────────
function selectLevel(lv) {
  level = lv;
  initScene();
  state = 'intro';
}

document.addEventListener('keydown', function(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const key = e.key.toLowerCase();

  if (state === 'level_select') {
    e.preventDefault();
    if (key === '1') { selectLevel(1); return; }
    if (key === '2') { selectLevel(2); return; }
    return;
  }
  if (state === 'celebrating') {
    e.preventDefault();
    state = 'level_select';
    return;
  }
  if (state !== 'waiting') return;
  if (currentBrick >= BRICK_COUNT) return;

  e.preventDefault();

  if (level === 1) {
    // Letter mode
    const expected = bricks[currentBrick].letter;
    if (key === expected) {
      const brickIdx = currentBrick;
      currentBrick++;
      startJump(brickIdx);
    } else if (key.length === 1) {
      addPopup(`Try  [ ${expected.toUpperCase()} ]`, W()/2, GY() - 130);
    }
  } else {
    // Number mode
    if (key >= '0' && key <= '9') {
      const expectedDigit = targetNumber[typedDigits.length];
      if (key === expectedDigit) {
        typedDigits.push(key);
        if (typedDigits.length === 4) {
          // All digits correct — jump!
          addPopup('\uD83C\uDF89 Got it!', W()/2, GY() - 130);
          const brickIdx = currentBrick;
          currentBrick++;
          startJump(brickIdx);
          // Next target will be set after landing
        }
      } else {
        // Wrong digit — flash red
        wrongFlashIdx = typedDigits.length;
        wrongFlash = 0.35;
      }
    }
  }
});

// ─── Mouse / Touch for level select ─────────────────────────────
function getCardBounds() {
  return {
    card1: drawLevelSelect._card1 || null,
    card2: drawLevelSelect._card2 || null,
  };
}

canvas.addEventListener('mousemove', function(e) {
  if (state !== 'level_select') { hoverCard = 0; canvas.style.cursor = 'default'; return; }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const { card1, card2 } = getCardBounds();
  if (card1 && mx >= card1.x && mx <= card1.x + card1.w && my >= card1.y && my <= card1.y + card1.h) {
    hoverCard = 1; canvas.style.cursor = 'pointer';
  } else if (card2 && mx >= card2.x && mx <= card2.x + card2.w && my >= card2.y && my <= card2.y + card2.h) {
    hoverCard = 2; canvas.style.cursor = 'pointer';
  } else {
    hoverCard = 0; canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('click', function(e) {
  if (state !== 'level_select') return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const { card1, card2 } = getCardBounds();
  if (card1 && mx >= card1.x && mx <= card1.x + card1.w && my >= card1.y && my <= card1.y + card1.h) {
    selectLevel(1);
  } else if (card2 && mx >= card2.x && mx <= card2.x + card2.w && my >= card2.y && my <= card2.y + card2.h) {
    selectLevel(2);
  }
});

// ─── Loop ────────────────────────────────────────────────────────
let lastT = 0;
function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

initScene();
requestAnimationFrame(loop);
</script>
