<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon & Princess Runner!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
  background: #bfe6ff;
  overflow: hidden;
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive;
  user-select: none;
  -webkit-user-select: none;
}
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; touch-action: none; }
#back-btn {
  position: absolute;
  top: 12px; left: 12px;
  background: rgba(255,255,255,0.9);
  border: 3px solid #e91e63;
  border-radius: 12px;
  padding: 8px 18px;
  font-size: 20px;
  font-weight: bold;
  color: #e91e63;
  cursor: pointer;
  text-decoration: none;
  z-index: 10;
  font-family: 'Segoe UI', sans-serif;
}
#back-btn:hover { background: #fce4ec; }

/* ---------- Title overlay ---------- */
#overlay {
  position: fixed; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.7), rgba(255,228,240,0.5) 60%, rgba(207,232,255,0.3));
  transition: opacity 0.6s ease;
}
#overlay.hide { opacity: 0; pointer-events: none; }
.card {
  text-align: center;
  padding: 22px 30px 26px;
  background: rgba(255,255,255,0.9);
  border-radius: 36px;
  border: 6px solid #ffd23f;
  box-shadow: 0 12px 0 #ffb3c7, 0 22px 40px rgba(0,0,0,0.12);
  max-width: 100%;
}
.cast { font-size: 58px; }
.cast span { display: inline-block; animation: bob 1.8s ease-in-out infinite; }
.cast span:nth-child(2) { animation-delay: 0.3s; }
.cast span:nth-child(3) { animation-delay: 0.6s; }
#title { font-size: clamp(32px, 6.5vw, 70px); line-height: 1.15; margin: 4px 0 12px; }
#title span { display: inline-block; text-shadow: 0 4px 0 rgba(0,0,0,0.13); animation: hop 1.4s ease-in-out infinite; }
.levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 4px auto 14px; max-width: 560px; }
.lvl-btn, #go-btn {
  font-family: inherit; cursor: pointer; border: 4px solid #e0d4ff; background: #fff;
  border-radius: 22px; color: #5a2d82; transition: transform 0.15s;
}
.lvl-btn { font-size: clamp(18px, 2.6vw, 24px); padding: 10px 14px; text-align: left; }
.lvl-btn small { display: block; font-size: 0.65em; color: #8a6fb8; margin-left: 2.1em; }
.lvl-btn:hover { transform: translateY(-3px); }
.lvl-btn.selected { border-color: #ffb302; background: #fff6d6; box-shadow: 0 5px 0 #ffd23f; }
.key {
  display: inline-block; min-width: 1.5em; margin-right: 8px; padding: 0 6px; border-radius: 8px; text-align: center;
  background: #7a4fd6; color: #fff; font-size: 0.75em; vertical-align: middle; box-shadow: 0 3px 0 #4a2a96;
}
#go-btn {
  font-size: clamp(22px, 3.4vw, 30px); padding: 8px 26px;
  background: #7a4fd6; color: #fff; border-color: #7a4fd6; box-shadow: 0 5px 0 #4a2a96;
  animation: pulse 1.2s ease-in-out infinite;
}
#go-btn.wiggle { animation: wiggle 0.4s ease; }
.hints { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.hints span { background: #fff3c4; border-radius: 999px; padding: 6px 14px; font-size: 17px; color: #6b4a00; }

/* ---------- HUD ---------- */
#hud {
  position: fixed; top: 12px; right: 12px; z-index: 4; display: none; gap: 14px; align-items: center;
  background: rgba(255,255,255,0.92); border: 3px solid #ffd23f; border-radius: 16px; padding: 6px 16px;
  font-size: 20px; color: #6b4a00; box-shadow: 0 4px 0 #ffb3c7;
}
#hud.show { display: flex; }
.bar { position: relative; width: clamp(120px, 24vw, 280px); height: 16px; background: #ffe9f2; border-radius: 999px; border: 2px solid #ffb3c7; margin: 0 22px 0 10px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #ff8fb8, #ffd23f); border-radius: 999px; transition: width 0.4s; }
.bar .who { position: absolute; top: 50%; left: 0; transform: translate(-50%, -55%); font-size: 26px; transition: left 0.4s; }
.bar .goal { position: absolute; top: 50%; right: -26px; transform: translateY(-55%); font-size: 26px; }
#hud .esc { font-size: 13px; color: #9a7b3a; }
@media (max-width: 760px) {
  #hud { top: 64px; left: 12px; right: 12px; justify-content: center; flex-wrap: wrap; font-size: 17px; gap: 8px; }
  #hud .esc { display: none; }
  #overlay { padding-top: 64px; align-items: flex-start; overflow-y: auto; }
  .card { padding: 16px 14px 20px; }
  #title { font-size: 28px; }
  .levels { gap: 8px; }
}
#banner {
  position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 4; display: none;
  background: rgba(255,255,255,0.94); border: 5px solid #ffd23f; border-radius: 26px; padding: 12px 26px;
  font-size: clamp(22px, 3.6vw, 36px); color: #7a4fd6; box-shadow: 0 8px 0 #ffb3c7; text-align: center;
  animation: pulse 1.2s ease-in-out infinite; max-width: calc(100% - 32px);
}
#banner.show { display: block; }
#msg {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: #fff; border-radius: 16px; padding: 10px 18px; font-size: 18px; color: #b0003a;
  display: none; z-index: 6;
}
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes bob { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-8px); } }
@keyframes pulse { 0%, 100% { transform: translateX(var(--tx, 0)) scale(1); } 50% { transform: translateX(var(--tx, 0)) scale(1.06); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
#banner { --tx: -50%; }
</style>
</head>
<body>
<a id="back-btn" href="index.html">← Home</a>
<div id="scene"></div>

<div id="overlay">
  <div class="card">
    <div class="cast"><span>🐉</span> <span>👸</span> <span>🏰</span></div>
    <h1 id="title">Dragon &amp; Princess!</h1>
    <div class="levels">
      <button class="lvl-btn" data-level="1" type="button"><span class="key">1</span>🐢 Easy<small>6 jumps to the castle</small></button>
      <button class="lvl-btn" data-level="2" type="button"><span class="key">2</span>🐇 Faster<small>8 jumps, more obstacles</small></button>
      <button class="lvl-btn" data-level="3" type="button"><span class="key">3</span>💎 Gems<small>10 jumps, catch the gems</small></button>
      <button class="lvl-btn" data-level="4" type="button"><span class="key">4</span>🔤 Letter jumps<small>press the letter on the sign</small></button>
    </div>
    <button id="go-btn" type="button">▶ Play!</button>
    <div class="hints">
      <span>␣ Space / any key / tap = jump</span>
      <span>Esc = menu</span>
    </div>
  </div>
</div>
<div id="hud">
  <span id="hud-level">Level 1</span>
  <div class="bar"><div class="fill" id="hud-fill"></div><span class="who" id="hud-who">👸</span><span class="goal">🏰</span></div>
  <span id="hud-gems">💎 0</span>
  <span class="esc">Esc = menu</span>
</div>
<div id="banner"></div>
<div id="msg"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
// ================================================================
//  Dragon & Princess — 3D runner for little kids (three.js)
//  The friendly dragon chases; jump the obstacles to reach the castle.
//  No fail: a bump only lets the dragon close in, it never catches her.
// ================================================================
import * as THREE from 'three';

// ---------------------------------------------------------------
//  Small helpers
// ---------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

const BLOCK_COLORS = ['#ff5c8a', '#ffb302', '#36c26b', '#3fa7ff', '#a066ff', '#ff7a3d',
                      '#00c2b8', '#ff4f4f', '#f2c400', '#7bd23a', '#ff6fd8', '#4f7dff'];
const SPARK_COLORS = ['#ffd23f', '#ff5c8a', '#6ee7ff', '#a6ff6e', '#c98bff', '#ffffff', '#ff9a3d'];
const KID_FONT = '"Comic Sans MS", "Chalkboard SE", "Comic Neue", "Marker Felt", cursive';

// ---------------------------------------------------------------
//  Gameplay constants. Carried over from the 2D game (verified):
//  the jump is TIME-based, never per-frame, so 60 Hz and 120 Hz play the same.
// ---------------------------------------------------------------
const JUMP_TIME   = 1.35;                                   // seconds in the air (long + floaty)
const JUMP_HEIGHT = 2.4;                                    // peak (world units); tallest hitbox is 0.62
const GRAVITY     = 8 * JUMP_HEIGHT / (JUMP_TIME * JUMP_TIME);
const JUMP_V0     = 4 * JUMP_HEIGHT / JUMP_TIME;
const HOP_HEIGHT  = 0.16;                                   // L4 wrong key: a tiny hop that can't clear anything
const HOP_V0      = Math.sqrt(2 * GRAVITY * HOP_HEIGHT);
const JUMP_BUFFER = 0.25;                                   // a press this close before landing still jumps
const SIM_DT      = 1 / 240;                                // fixed physics substep (same at any refresh rate)
const PRINCESS_HW = 0.25;                                   // forgiving hitbox: half-width…
const FOOT_LIFT   = 0.08;                                   // …and its bottom sits a little above her feet
const IDEAL_LEAD  = JUMP_TIME / 2;                          // L4: an early right letter jumps this long before arrival
const SPAWN_X = 17, DESPAWN_X = -14;

// Chase tension: 0 = princess safe & far ahead, 1 = dragon right behind her.
const TENSION_START = 0.4, TENSION_CREEP = 0.05, TENSION_SUCCESS = 0.18, TENSION_HIT = 0.22;
const EASE_RATE = 6;
// NEAR is the cap: just behind her, never on her. -1.9 measured a mesh gap of -0.8 (snout + lean
// reached into her); -3.1 keeps a visible gap (≥ 0.4, check with __pd.gap()) at full tension.
const DRAGON_FAR_X = -5.6, DRAGON_NEAR_X = -3.1;

// Obstacle hitboxes (smaller than the meshes, on purpose)
const OBSTACLES = {
  rock:   { hw: 0.35, h: 0.55 },
  log:    { hw: 0.50, h: 0.42 },
  bush:   { hw: 0.40, h: 0.55 },
  puddle: { hw: 0.32, h: 0.35 },   // the frog sitting in it is what she hops over
  fence:  { hw: 0.45, h: 0.62 },
};
const ALL_TYPES = Object.keys(OBSTACLES);
const LEVELS = {
  1: { name: 'Easy',         speed: 4.2, gap: [3.2, 4.2], types: ['rock', 'log', 'bush'], goal: 6,  gem: 0.3,  arcs: 0 },
  2: { name: 'Faster',       speed: 5.2, gap: [2.5, 3.4], types: ALL_TYPES,               goal: 8,  gem: 0.35, arcs: 0 },
  3: { name: 'Gems',         speed: 5.0, gap: [2.6, 3.5], types: ALL_TYPES,               goal: 10, gem: 0,    arcs: 0.85 },
  4: { name: 'Letter jumps', speed: 4.2, gap: [3.4, 4.4], types: ALL_TYPES,               goal: 8,  gem: 0,    arcs: 0, letters: true },
};
const MAX_LEVEL = 4;

// ---------------------------------------------------------------
//  Title letters (rainbow hop)
// ---------------------------------------------------------------
(function decorateTitle() {
  const el = document.getElementById('title');
  const text = el.textContent;
  el.textContent = '';
  let ci = 0;
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    if (ch !== ' ') s.style.color = BLOCK_COLORS[ci++ % BLOCK_COLORS.length];
    s.style.animationDelay = (i * 0.07) + 's';
    el.appendChild(s);
  });
})();

// ---------------------------------------------------------------
//  Audio (synthesized WebAudio, same helpers as game5)
// ---------------------------------------------------------------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, master = null, noiseBuf = null;
function ensureAudio() {
  if (!AudioCtx) return;
  if (!audioCtx) {
    audioCtx = new AudioCtx();
    master = audioCtx.createGain();
    master.gain.value = 0.6;
    master.connect(audioCtx.destination);
    // one second of white noise, reused by every noisy sound
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state !== 'running') audioCtx.resume();   // 'suspended', or Safari's 'interrupted'
}
// A single oscillator note with a pitch glide and a quick envelope
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
// Filtered noise burst (pops, whooshes, crackles)
function noise(dur, vol, ftype, f0, f1 = f0, delay = 0, q = 1) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
  const f = audioCtx.createBiquadFilter(); f.type = ftype; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, Math.random() * 0.4); src.stop(t + dur + 0.05);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
const sfx = {
  whoop()  { tone('sine', 500, 900, 0.12, 0.05); },
  jump()   { tone('sine', 380, 760, 0.25, 0.16); tone('triangle', 760, 1150, 0.16, 0.05, 0.05); },
  hop()    { tone('sine', 420, 560, 0.1, 0.07); },
  land()   { noise(0.07, 0.08, 'lowpass', 500); },
  clear()  { tone('triangle', 659, 659, 0.18, 0.16); tone('triangle', 988, 988, 0.25, 0.16, 0.1); },
  bonk()   { tone('square', 180, 90, 0.18, 0.08); noise(0.1, 0.16, 'lowpass', 600); tone('sine', 520, 260, 0.3, 0.1, 0.08); },
  bump()   { tone('sine', 300, 120, 0.3, 0.2); noise(0.08, 0.14, 'lowpass', 900); tone('triangle', 220, 170, 0.35, 0.06, 0.06); },
  gem(i)   { const f = 784 * Math.pow(2, PENTA[i % PENTA.length] / 12); tone('triangle', f, f, 0.3, 0.13); tone('sine', f * 2, f * 2, 0.2, 0.05, 0.03); },
  puff()   { noise(0.3, 0.04, 'lowpass', 700, 250); },
  gate()   { tone('triangle', 170, 120, 0.8, 0.1); noise(0.8, 0.05, 'bandpass', 320, 200, 0, 3); },
  fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.32, 0.18, i * 0.14));
    tone('triangle', 1047, 1047, 0.9, 0.18, 0.6); tone('triangle', 1319, 1319, 0.9, 0.1, 0.6);
  },
  launch() { noise(0.6, 0.1, 'bandpass', 300, 2500, 0, 2); },
  boom()   {
    noise(0.6, 0.35, 'lowpass', 1500, 120);
    for (let i = 0; i < 8; i++) noise(0.03, 0.1, 'highpass', 3000, 3000, rand(0.15, 0.6));
  },
};

// ---------------------------------------------------------------
//  Speech (guarded — copied verbatim from game5)
// ---------------------------------------------------------------
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let voice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  voice = vs.find(v => /^en[-_]US/i.test(v.lang) && /Samantha|Google US|Karen|Zira|Aria|Jenny/i.test(v.name))
       || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (synth) {
  pickVoice();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice);
}
// A bare capital ("C") is read as "capital C"; lower-case it. Measured on macOS Samantha: lower-case
// letters read as letter names (even "a"), while "ay" reads as "eye", so no phonetic respelling.
// Speech can go silent for good after long play, a backgrounded tab or Mac sleep: the engine is
// left paused, its queue gets stuck "speaking", or Chrome garbage-collects a queued utterance and
// never finishes it. So keep recent utterances referenced and un-stick the engine before each line.
const keepUtterances = [];
let lastSpeechStart = 0;
function unstickSpeech(s) {
  if (s.paused) s.resume();
  // nothing we say lasts 8 s: still busy after that means the queue is stuck
  if ((s.speaking || s.pending) && performance.now() - lastSpeechStart > 8000) s.cancel();
}
function trackUtterance(u, s) {
  // the "stuck" clock starts when a line is queued onto an idle engine, and moves on each start/end
  if (!s.speaking && !s.pending) lastSpeechStart = performance.now();
  u.onstart = u.onend = () => { lastSpeechStart = performance.now(); };
  keepUtterances.push(u);
  if (keepUtterances.length > 20) keepUtterances.shift();
}
function speakableLetters(text) {
  return text.replace(/\b([A-Z])\b/g, ch => ch.toLowerCase());
}

function speak(text, interrupt = true) {
  if (!synth) return;
  text = speakableLetters(text);
  try {
    unstickSpeech(synth);
    if (interrupt) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : 'en-US';
    u.pitch = 1.2;
    u.rate = 0.95;
    trackUtterance(u, synth);
    synth.speak(u);
  } catch (e) { /* speech is a bonus; never break the game */ }
}

// ---------------------------------------------------------------
//  Renderer / scene / camera
// ---------------------------------------------------------------
const container = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  const m = document.getElementById('msg');
  m.textContent = 'Sorry! This browser cannot show 3D graphics (WebGL).';
  m.style.display = 'block';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color('#bfe6ff');
scene.fog = new THREE.Fog('#d9f1ff', 40, 110);

const FOV = 42;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 300);
const CAM_OFFSET = new THREE.Vector3(-2.4, 3.0, 11.5);     // side-on 3/4 view
const camTarget = new THREE.Vector3(1.0, 1.3, 0);
let camDist = 1;

scene.add(new THREE.HemisphereLight('#fff6e8', '#b8e09a', 1.7));
const sun = new THREE.DirectionalLight('#fff1dc', 2.2);
sun.position.set(-6, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 18, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);
sun.target.position.set(1, 0, 0);
scene.add(sun.target);

// ---------------------------------------------------------------
//  Canvas texture helpers (all art drawn here — no image files)
// ---------------------------------------------------------------
function makeCanvas(w, h = w) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function toTexture(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  return t;
}
function heartPath(g, cx, cy, s) {
  g.beginPath();
  g.moveTo(cx, cy + s * 0.35);
  g.bezierCurveTo(cx - s * 0.9, cy - s * 0.25, cx - s * 0.45, cy - s * 0.95, cx, cy - s * 0.45);
  g.bezierCurveTo(cx + s * 0.45, cy - s * 0.95, cx + s * 0.9, cy - s * 0.25, cx, cy + s * 0.35);
  g.closePath();
}
const puffTex = (() => {
  const [c, g] = makeCanvas(128);
  const gr = g.createRadialGradient(64, 64, 4, 64, 64, 60);
  gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.6, 'rgba(240,240,250,0.7)'); gr.addColorStop(1, 'rgba(240,240,250,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return toTexture(c);
})();
const heartTex = (() => {
  const [c, g] = makeCanvas(128);
  g.fillStyle = '#ff7eb6'; heartPath(g, 64, 70, 70); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.arc(44, 46, 9, 0, Math.PI * 2); g.fill();
  return toTexture(c);
})();
// Big letter sign for Letter jumps (cached per letter, never disposed)
const signTexCache = new Map();
function signTexture(L) {
  if (!signTexCache.has(L)) {
    const [c, g] = makeCanvas(256);
    g.fillStyle = '#fff8e7'; g.fillRect(0, 0, 256, 256);
    g.lineWidth = 16; g.strokeStyle = '#ff7eb6'; g.strokeRect(8, 8, 240, 240);
    g.textAlign = 'center'; g.textBaseline = 'middle';

let now = 0;
const timers = [];
function later(delay, fn) { timers.push({ at: now + delay, fn }); }
function runTimers() {
  for (let i = timers.length - 1; i >= 0; i--) {

}

function emitSpark(x, y, z, vx, vy, vz, hex, size, life, grav = 3) {
  const i = sparkCursor; sparkCursor = (sparkCursor + 1) % SPARK_N;

  sBase[i] = size; sSize[i] = size; sLife[i] = life; sMax[i] = life; sGrav[i] = grav; sAlpha[i] = 1;

function burst(pos, count, speed, colors, size = 0.35, life = 1.2, grav = 2.5) {
  for (let k = 0; k < count; k++) {

    const sp = speed * rand(0.7, 1.1);
    emitSpark(pos.x, pos.y, pos.z, r * Math.cos(th) * sp, u * sp, r * Math.sin(th) * sp,

    sLife[i] -= dt;
    if (sLife[i] <= 0) { sAlpha[i] = 0; sSize[i] = 0; continue; }
    const j = i * 3;
    sVel[j] *= drag; sVel[j + 1] = sVel[j + 1] * drag - sGrav[i] * dt; sVel[j + 2] *= drag;
    sPos[j] += sVel[j] * dt; sPos[j + 1] += sVel[j + 1] * dt; sPos[j + 2] += sVel[j + 2] * dt;
    const k = sLife[i] / sMax[i];
    sAlpha[i] = Math.min(1, k * 1.6) * (0.75 + 0.25 * Math.sin(now * 30 + i));
    sSize[i] = sBase[i] * (0.4 + 0.6 * k);
  }
  for (const n of ['position', 'aSize', 'aAlpha', 'aColor']) sparkGeo.attributes[n].needsUpdate = true;
}

const CONF_N = 400;
const confMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.17, 0.1),
  new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), CONF_N);
confMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
confMesh.frustumCulled = false;
const ZERO_M = new THREE.Matrix4().makeScale(0, 0, 0);
const conf = [];
for (let i = 0; i < CONF_N; i++) {
  conf.push({ life: 0, p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), s: new THREE.Vector3() });
  confMesh.setMatrixAt(i, ZERO_M);
  confMesh.setColorAt(i, tmpCol.set('#ffffff'));
}
scene.add(confMesh);
let confCursor = 0;
const dummy = new THREE.Object3D();
function confettiBurst(center, count, spread = 1, up = 5) {
  for (let k = 0; k < count; k++) {
    const i = confCursor; confCursor = (confCursor + 1) % CONF_N;
    const c = conf[i];
    c.life = rand(2.2, 3.4);
    c.p.set(center.x + rand(-spread, spread), center.y + rand(-0.3, 0.3), center.z + rand(-spread, spread) * 0.6);
    c.v.set(rand(-3, 3), rand(up * 0.5, up), rand(-2, 2));
    c.r.set(rand(0, 6), rand(0, 6), rand(0, 6));
    c.s.set(rand(-8, 8), rand(-8, 8), rand(-8, 8));
    confMesh.setColorAt(i, tmpCol.set(pick(BLOCK_COLORS)));
  }
  confMesh.instanceColor.needsUpdate = true;
}
function updateConfetti(dt) {
  const drag = Math.exp(-1.4 * dt);
  for (let i = 0; i < CONF_N; i++) {
    const c = conf[i];
    if (c.life <= 0) continue;
    c.life -= dt;
    if (c.life <= 0) { confMesh.setMatrixAt(i, ZERO_M); continue; }
    c.v.x *= drag; c.v.z *= drag;
    c.v.y = Math.max(c.v.y - 6 * dt, -1.6);           // flutter down slowly
    c.p.addScaledVector(c.v, dt);
    c.p.x += Math.sin(now * 5 + i) * 0.5 * dt;
    if (c.p.y < 0.02) c.p.y = 0.02;
    c.r.x += c.s.x * dt; c.r.y += c.s.y * dt; c.r.z += c.s.z * dt;
    dummy.position.copy(c.p); dummy.rotation.copy(c.r);
    dummy.scale.setScalar(Math.min(1, c.life / 0.5));
    dummy.updateMatrix();
    confMesh.setMatrixAt(i, dummy.matrix);
  }
  confMesh.instanceMatrix.needsUpdate = true;
}

// ---------------------------------------------------------------
//  Obstacles (+ gems) — shared geometry/materials; L4 signs own a material
// ---------------------------------------------------------------
function buildObstacleMesh(type) {
  const g = new THREE.Group();
  const extra = {};
  if (type === 'rock') {
    part(GEO.dodeca, flat('#9aa3ad'), [0, 0.3, 0], [0.46, 0.36, 0.42], g);
    part(GEO.dodeca, flat('#b8c0c8'), [0.08, 0.6, 0.05], [0.26, 0.2, 0.24], g);
  } else if (type === 'log') {
    const l = part(GEO.cyl, [mat('#9c6b3f'), mat('#e9c08f'), mat('#e9c08f')], [0, 0.25, 0], [0.25, 1.15, 0.25], g);
    l.rotation.z = Math.PI / 2;
    part(GEO.cyl, mat('#fff4e0'), [0.2, 0.52, 0], [0.03, 0.1, 0.03], g);
    part(GEO.sphere, mat('#ff4f4f'), [0.2, 0.6, 0], [0.1, 0.06, 0.1], g);
  } else if (type === 'bush') {
    part(GEO.lowSphere, flat('#4fb35f'), [0, 0.32, 0], [0.42, 0.36, 0.42], g);
    part(GEO.lowSphere, flat('#62c46f'), [-0.25, 0.25, 0.1], [0.3, 0.27, 0.3], g);
    part(GEO.lowSphere, flat('#5abd68'), [0.26, 0.24, -0.05], [0.28, 0.25, 0.28], g);
    for (let i = 0; i < 6; i++) part(GEO.sphere, mat('#ff4f6d'), [rand(-0.35, 0.35), rand(0.25, 0.6), rand(0.2, 0.38)], [0.05, 0.05, 0.05], g);
  } else if (type === 'puddle') {
    const pd = part(GEO.cyl, mat('#7cc6ff', { roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.85 }), [0, 0.02, 0], [0.75, 0.02, 0.6], g);
    pd.castShadow = false;
    const frog = new THREE.Group(); g.add(frog);
    part(GEO.sphere, mat('#5cc26b'), [0, 0.18, 0], [0.24, 0.17, 0.22], frog);
    [-1, 1].forEach(s => {
      part(GEO.sphere, mat('#ffffff'), [0.08, 0.33, s * 0.1], [0.08, 0.08, 0.08], frog);
      part(GEO.sphere, mat('#1d1d2b'), [0.13, 0.34, s * 0.12], [0.04, 0.045, 0.04], frog);
    });
    part(new THREE.TorusGeometry(1, 0.2, 6, 12, Math.PI), mat('#2f7a3c'), [0.2, 0.17, 0], [0.06, 0.05, 0.08], frog).rotation.set(0, Math.PI / 2, Math.PI);
    extra.frog = frog;
  } else if (type === 'fence') {
    const wood = mat('#fff4e0');
    [-0.4, 0, 0.4].forEach(x => {
      part(GEO.box, wood, [x, 0.36, 0], [0.1, 0.72, 0.1], g);
      part(GEO.cone, wood, [x, 0.79, 0], [0.08, 0.14, 0.08], g).rotation.y = Math.PI / 4;
    });
    [0.28, 0.54].forEach(y => part(GEO.box, mat('#ffb3c7'), [0, y, 0.02], [0.98, 0.08, 0.06], g));
  }
  return { g, extra };
}

const gemMats = ['#ff5c8a', '#3fd0ff', '#ffd23f', '#a066ff', '#36e07b'].map(c =>
  new THREE.MeshStandardMaterial({ color: c, roughness: 0.15, metalness: 0.3, emissive: c, emissiveIntensity: 0.35, flatShading: true }));

const obstacles = [];
let lastLetters = [];
function spawnObstacle(forceType = null) {
  const cfg = LEVELS[game.level];
  const type = forceType || pick(cfg.types);
  const { g, extra } = buildObstacleMesh(type);
  g.position.set(SPAWN_X, 0, 0);
  scene.add(g);
  const o = { type, x: SPAWN_X, ...OBSTACLES[type], g, extra, hit: false, passed: false, gems: [], letter: null, armed: false, prompted: false, signMat: null, fade: 0 };
  // bonus gems: one above the obstacle, or (L3) an arc along the ideal jump
  const V = cfg.speed;
  const idealH = t => 0.85 + Math.max(1.0, 4 * JUMP_HEIGHT * (t / JUMP_TIME) * (1 - t / JUMP_TIME));
  let offs = [];
  if (cfg.arcs && Math.random() < cfg.arcs) offs = [-1.6, -0.8, 0, 0.8, 1.6];
  else if (cfg.gem && Math.random() < cfg.gem) offs = [0];
  offs.forEach((dx, i) => {
    const m = new THREE.Mesh(i % 2 && offs.length > 1 ? STAR_GEO : GEO.octa, gemMats[(i + obstacles.length) % gemMats.length]);
    m.scale.setScalar(i % 2 && offs.length > 1 ? 0.2 : 0.22);
    if (!(i % 2 && offs.length > 1)) m.scale.y = 0.3;
    m.castShadow = true;
    m.position.set(dx, idealH(JUMP_TIME / 2 + dx / V), 0);
    g.add(m);
    o.gems.push({ m, dx, y: m.position.y, taken: false });
  });
  // L4: a big letter sign behind the obstacle
  if (cfg.letters) {
    let L;
    do { L = String.fromCharCode(65 + Math.floor(Math.random() * 26)); } while (lastLetters.includes(L));
    lastLetters.push(L); if (lastLetters.length > 5) lastLetters.shift();
    o.letter = L;
    o.signMat = new THREE.MeshStandardMaterial({ map: signTexture(L), roughness: 0.6, emissive: '#36e07b', emissiveIntensity: 0 });
    part(GEO.cyl, mat('#a8703f'), [0, 0.8, -1.0], [0.05, 1.6, 0.05], g);
    part(GEO.box, [mat('#a8703f'), mat('#a8703f'), mat('#a8703f'), mat('#a8703f'), o.signMat, mat('#a8703f')], [0, 1.95, -1.0], [1.0, 1.0, 0.08], g);
  }
  obstacles.push(o);
  return o;
}
function removeObstacle(i) {
  const o = obstacles[i];
  scene.remove(o.g);
  if (o.signMat) o.signMat.dispose();         // the sign texture itself is cached
  obstacles.splice(i, 1);
}
function clearObstacles(poof = false) {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    if (poof && obstacles[i].x < 12) burst(new THREE.Vector3(obstacles[i].x, 0.5, 0), 18, 3, SPARK_COLORS, 0.3, 0.8, 2);
    removeObstacle(i);
  }
}

// ---------------------------------------------------------------
//  Game state (the simulation; everything visual reads from it)
// ---------------------------------------------------------------
const game = {
  state: 'title',            // title | intro | play | winning | won
  level: 1, score: 0, gems: 0, tension: TENSION_START,
  simTime: 0, stateTime: 0, spawnIn: 0, saidJump: false,
  debug: { noSpawn: false, noWin: false, noRender: false },
};
const P = { y: 0, vy: 0, air: false, kind: 'full', queued: 0, evJump: null, evLand: 0, dizzy: 0 };

function doJump(kind = 'full') {
  if (!P.air) {
    P.air = true; P.kind = kind;
    P.vy = kind === 'full' ? JUMP_V0 : HOP_V0;
    P.evJump = kind;
  } else if (kind === 'full') {
    P.queued = JUMP_BUFFER;                   // pressed while airborne: hop again on landing
  }
}

// The obstacle the princess should deal with next (for Letter jumps)
function currentTarget() {
  let best = null;
  for (const o of obstacles) {
    if (o.hit || o.passed || o.x < -(PRINCESS_HW + o.hw)) continue;
    if (!best || o.x < best.x) best = o;
  }
  return best;
}

function onClear(o) {
  o.passed = true;
  game.score++;
  game.tension = Math.max(0, game.tension - TENSION_SUCCESS);
  sfx.clear();
  burst(new THREE.Vector3(0, P.y + 1, 0), 26, 3.5, SPARK_COLORS, 0.3, 0.8, 2);
  if (o.extra.frog) o.frogHop = 0.6;
  updateHUD();
  if (game.score >= LEVELS[game.level].goal && !game.debug.noWin) startWinning();
}
function onBump(o) {
  o.hit = true;
  game.tension = Math.min(1, game.tension + TENSION_HIT);
  P.dizzy = 1.2;
  shake = 0.3;
  sfx.bump();
}

function onDragonBonk(o) {
  o.dragonHit = true;
  dragonBonk = 0.9;
  sfx.bonk();
  if (o.type === 'puddle') {                  // splash instead of flying, and the frog leaps away
    burst(new THREE.Vector3(o.x, 0.3, 0), 30, 3.2, ['#6ec8ff', '#b8ecff', '#ffffff'], 0.25, 0.7, 4);
    if (o.extra.frog) o.frogHop = 0.6;
  } else {
    // tossed high (over the dragon's ~2-unit height) and a little toward the camera, so it reads
    // vx cancels most of the world scroll so it tumbles above the dragon instead of leaving the screen
    o.knock = { y: 0, vy: 9, vx: LEVELS[game.level].speed * 0.6, z: 0, vz: 1.6, spin: 0 };
  }
  dragon.head.getWorldPosition(_p);
  burst(_p.setY(_p.y + 0.4), 16, 2.4, ['#ffd23f', '#ffffff', '#ff9a3d'], 0.28, 0.8, 0.5);
}

function simStep(h) {
  game.simTime += h;
  game.stateTime += h;
  const cfg = LEVELS[game.level];

  if (game.state === 'intro' && game.stateTime > 1.6) setState('play');

  // princess: purely vertical, integrated in time (keeps going while she runs to the castle)
  if ((game.state === 'play' || game.state === 'winning') && P.air) {
    P.vy -= GRAVITY * h;
    P.y += P.vy * h;
    if (P.queued > 0) P.queued -= h;
    if (P.y <= 0) {
      P.y = 0; P.air = false; P.evLand = Math.max(P.evLand, -P.vy); P.vy = 0;
      if (P.queued > 0 && game.state === 'play') { P.queued = 0; doJump('full'); }
    }
  }

  if (game.state === 'play') {
    game.tension = Math.min(1, game.tension + TENSION_CREEP * h);
    const V = cfg.speed;

    if (!game.debug.noSpawn) {
      game.spawnIn -= h;
      if (game.spawnIn <= 0) { spawnObstacle(); game.spawnIn = rand(cfg.gap[0], cfg.gap[1]); }
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= V * h;
      const tta = o.x / V;                       // seconds until it reaches her
      // light speech: "Jump!" for the first obstacle of a run; L4 says the letter instead
      if (!game.saidJump && !o.hit && !o.passed) {
        if (cfg.letters && tta < 3.2) { game.saidJump = true; o.prompted = true; speak(`Press ${o.letter}!`); }
        else if (!cfg.letters && tta < 1.7) { game.saidJump = true; speak('Jump!'); }
      }
      // L4: the right letter pressed early "arms" a perfectly timed jump
      if (o.armed && tta <= IDEAL_LEAD && !P.air) { o.armed = false; doJump('full'); }
      // bump: overlapping her (forgiving) hitbox while she is low
      if (!o.hit && !o.passed && Math.abs(o.x) < PRINCESS_HW + o.hw && P.y + FOOT_LIFT < o.h) onBump(o);
      // clean jump: it slipped past her feet
      if (!o.hit && !o.passed && o.x < -(PRINCESS_HW + o.hw)) { onClear(o); if (game.state !== 'play') return; }
      // gems: pure bonus, caught when she is up there
      for (const gm of o.gems) {
        if (gm.taken) continue;
        if (Math.abs(o.x + gm.dx) < 0.55 && Math.abs(gm.y - (P.y + 0.85)) < 0.85) {
          gm.taken = true; game.gems++; gm.pop = 0.001;
          sfx.gem(game.gems); updateHUD();
          const wp = new THREE.Vector3(o.x + gm.dx, gm.y, 0);
          burst(wp, 20, 3, ['#ffffff', '#ffd23f', '#6ee7ff'], 0.25, 0.7, 1.5);
        }
      }
      // the dragon runs into whatever got past her: bonk!
      if (!o.dragonHit && o.x < dragonX + DRAGON_FRONT + o.hw * 0.5) onDragonBonk(o);
      if (o.knock) { o.knock.vy -= 16 * h; o.knock.y += o.knock.vy * h; o.x += o.knock.vx * h; o.knock.z += o.knock.vz * h; o.knock.spin += 9 * h; }
      if (o.x < DESPAWN_X || (o.knock && o.knock.y < -3)) removeObstacle(i);
    }
  }

  if (game.state === 'winning' && game.stateTime > 2.6) setState('won');
  if (game.state === 'won' && game.stateTime > 8) startLevel(Math.min(MAX_LEVEL, game.level + 1));
}

let simAcc = 0;
function simulate(dt) {
  simAcc += dt;
  while (simAcc >= SIM_DT - 1e-9) { simStep(SIM_DT); simAcc -= SIM_DT; }
}

const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
const banner = document.getElementById('banner');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked: fine */ } },
};
let selectedLevel = clamp(parseInt(store.get('pd.level', '1'), 10) || 1, 1, MAX_LEVEL);

function setState(s) {
  game.state = s;
  game.stateTime = 0;
  if (s === 'play') game.spawnIn = 1.2;            // first obstacle arrives shortly after the run-in
  if (s === 'won') {
    gateOpen = 0.001;
    sfx.gate();
    later(0.4, () => { sfx.fanfare(); fireworks(5); });
    later(1.4, () => fireworks(4));
    confettiBurst(new THREE.Vector3(CASTLE_WIN.x, 5, CASTLE_WIN.z + 2), 160, 4, 4);
    speak('Hooray!');
    banner.textContent = game.level < MAX_LEVEL ? '🎉 Hooray! Press SPACE for the next level' : '🎉 Hooray! Press SPACE to play again';
    banner.classList.add('show');
  }
}
function startLevel(n) {
  ensureAudio();
  game.level = clamp(n, 1, MAX_LEVEL);
  selectedLevel = game.level;
  store.set('pd.level', String(game.level));
  clearObstacles();
  game.score = 0; game.gems = 0; game.tension = TENSION_START; game.saidJump = false;
  Object.assign(P, { y: 0, vy: 0, air: false, queued: 0, evJump: null, evLand: 0, dizzy: 0 });
  lastLetters = [];
  princessX = -7; princessZ = 0; dragonX = -12; dragonFriendly = 0; gateOpen = 0; castleProg = 0;
  castle.position.copy(CASTLE_FAR);
  overlay.classList.add('hide');

  hud.classList.add('show');

  updateHUD();

}
function startWinning() {
  clearObstacles(true);
  setState('winning');
}
function backToTitle() {
  clearObstacles();
  if (synth) { try { synth.cancel(); } catch (e) { /* ignore */ } }
  Object.assign(P, { y: 0, vy: 0, air: false, queued: 0, dizzy: 0 });
  game.tension = TENSION_START;
  dragonFriendly = 0; gateOpen = 0; castleProg = 0; princessZ = 0;
  castle.position.copy(CASTLE_FAR);
  banner.classList.remove('show');

const MODIFIER_KEYS = new Set(['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Fn', 'FnLock', 'AltGraph', 'OS', 'Hyper', 'Super', 'Dead', 'Unidentified']);

// One key press, already filtered. key = KeyboardEvent.key (or ' ' for space)
function handleKey(key, code = '') {
  if (game.state === 'title') {
    if (/^[1-4]$/.test(key)) startLevel(+key);
    else if (key === ' ' || key === 'Enter') startLevel(selectedLevel);
    else { goBtn.classList.remove('wiggle'); void goBtn.offsetWidth; goBtn.classList.add('wiggle'); }
    return;
  }
  if (key === 'Escape') { backToTitle(); return; }
  if (game.state === 'won') {
    if (game.stateTime > 1.2) startLevel(Math.min(MAX_LEVEL, game.level + 1));
    return;
  }
  if (game.state !== 'play') return;
  if (!LEVELS[game.level].letters) { doJump('full'); return; }

  // Letter jumps: the sign's letter = full jump, anything else = a tiny hop
  let letter = null;
  if (/^[a-z]$/i.test(key)) letter = key.toUpperCase();
  else if (/^Key[A-Z]$/.test(code)) letter = code.slice(3);
  const target = currentTarget();
  if (target && letter === target.letter) {
    speak(`${letter}!`);
    if (target.x / LEVELS[game.level].speed > IDEAL_LEAD) target.armed = true;
    else doJump('full');
  } else {
    doJump('hop');
    if (target && !target.prompted) { target.prompted = true; speak(`Press ${target.letter}!`); }
  }
}

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;      // leave browser shortcuts alone
  e.preventDefault();                      // no scrolling / back-navigation
  if (e.repeat) return;
  const key = e.key || '';
  if (MODIFIER_KEYS.has(key)) return;
  ensureAudio();
  handleKey(e.code === 'Space' ? ' ' : key, e.code || '');
});

// Tap (tablets): jump; in Letter jumps a tap is just a tiny hop
renderer.domElement.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  if (game.state === 'won') { handleKey(' '); return; }
  if (game.state === 'play') handleKey(LEVELS[game.level].letters ? 'Tap' : ' ');
});

// ---------------------------------------------------------------
//  Animation (visual only — reads the simulation)
// ---------------------------------------------------------------
let princessX = 0, princessZ = 0, dragonX = -4, dragonFriendly = 0, gateOpen = 0, castleProg = 0;
let dragonBonk = 0;   // seconds left of the dragon's bonk wobble
let shake = 0, scrollSpeed = 2.5, runPhase = 0, dragonPhase = 0, puffIn = 2, heartIn = 0;
const pAnim = { sq: 0, sqV: 0 };
const _p = new THREE.Vector3();

function animate(dt) {
  const st = game.state, cfg = LEVELS[game.level];
  const ef = k => 1 - Math.exp(-k * dt);

  // world scroll speed (path, grass, scenery)
  const targetScroll = st === 'title' ? 2.5 : (st === 'intro' || st === 'play') ? cfg.speed : 0;
  scrollSpeed += (targetScroll - scrollSpeed) * ef(st === 'winning' ? 1.6 : 4);
  pathTex.offset.x += scrollSpeed * dt / PATH_TILE;
  grassTex.offset.x += scrollSpeed * dt / GRASS_TILE;
  for (const s of scenery) {
    s.obj.position.x -= scrollSpeed * s.factor * dt;
    if (s.obj.position.x < s.minX) s.obj.position.x += s.span;
  }

  // princess position: home at x = 0; run in on intro, run to the castle on win
  let pxTarget = 0, pzTarget = 0;
  if (st === 'winning' || st === 'won') pxTarget = WIN_PRINCESS_X;
  if (st === 'won' && game.stateTime > 0.8) pzTarget = GATE_Z + 0.3;
  princessX += (pxTarget - princessX) * ef(st === 'intro' ? 3 : 2.2);
  princessZ += (pzTarget - princessZ) * ef(1.5);
  if (st === 'play') princessX = Math.abs(princessX) < 0.01 ? 0 : princessX * (1 - ef(6));

  // dragon follows the chase tension (capped just behind her)
  const dxTarget = st === 'title' ? -4.2 : (st === 'winning' || st === 'won') ? WIN_PRINCESS_X - 4
    : lerp(DRAGON_FAR_X, DRAGON_NEAR_X, game.tension);
  dragonX += (dxTarget - dragonX) * ef(st === 'intro' ? 2.5 : EASE_RATE * 0.5);

  // princess body: jump height, run cycle, squash & stretch, dizzy wobble
  if (P.evJump) { pAnim.sq = P.evJump === 'full' ? 0.22 : 0.08; pAnim.sqV = 0; (P.evJump === 'full' ? sfx.jump : sfx.hop)(); P.evJump = null; }
  if (P.evLand) { pAnim.sq = -clamp(P.evLand * 0.035, 0.08, 0.32); pAnim.sqV = 0; sfx.land(); P.evLand = 0; }
  pAnim.sqV += (-260 * pAnim.sq - 9 * pAnim.sqV) * dt;
  pAnim.sq += pAnim.sqV * dt;
  const air = P.air && (st === 'play' || st === 'winning');
  const moving = st === 'title' || st === 'intro' || st === 'play' || (st === 'winning') || (st === 'won' && Math.abs(princessZ - pzTarget) > 0.05);
  runPhase += dt * (moving ? 11 : 0);
  const sw = Math.sin(runPhase);
  const pr = princess;
  pr.root.position.set(princessX, (st === 'play' || st === 'winning' ? P.y : 0) + (!air && moving ? Math.abs(sw) * 0.05 : 0), princessZ);
  const stretch = pAnim.sq + (air ? Math.min(0.1, Math.abs(P.vy) * 0.015) : 0);
  const sy = Math.max(0.6, 1 + stretch), sxz = 1 / Math.sqrt(sy);
  pr.body.scale.set(sxz, sy, sxz);
  if (air) {
    pr.legs[0].rotation.z = 0.7; pr.legs[1].rotation.z = -0.3;
    pr.arms[0].rotation.z = 2.4; pr.arms[1].rotation.z = 2.4;
  } else if (st === 'won' && !moving) {
    pr.legs.forEach(l => { l.rotation.z *= 0.8; });
    pr.arms.forEach((a, i) => { a.rotation.z = 2.6 + Math.sin(now * 8 + i) * 0.25; });
  } else {
    pr.legs[0].rotation.z = sw * 0.8; pr.legs[1].rotation.z = -sw * 0.8;
    pr.arms[0].rotation.z = -sw * 0.7; pr.arms[1].rotation.z = sw * 0.7;
  }
  // she faces the run direction; turns toward the gate at the end
  const faceY = st === 'won' && game.stateTime > 0.8 ? Math.PI / 2 : 0;
  pr.root.rotation.y += (faceY - pr.root.rotation.y) * ef(5);
  P.dizzy = Math.max(0, P.dizzy - dt);
  pr.dizzy.visible = P.dizzy > 0;
  pr.dizzy.rotation.y += dt * 8;
  pr.body.rotation.x = P.dizzy > 0 ? Math.sin(now * 18) * 0.15 * P.dizzy : 0;
  pr.dressMat.emissive.setRGB(P.dizzy > 0 ? 0.35 * (0.5 + 0.5 * Math.sin(now * 25)) * P.dizzy : 0, 0, 0);
  pr.root.visible = !(st === 'won' && game.stateTime > 2.6);   // she's inside the castle

  // dragon: run cycle, flapping wings, wagging tail, leaning in with tension, puffs
  const dr = dragon;
  dragonPhase += dt * (st === 'won' ? 4 : 9);
  dragonBonk = Math.max(0, dragonBonk - dt);
  const bk = dragonBonk / 0.9;                                 // 1 → 0 over the bonk
  dr.root.position.set(dragonX - Math.sin(bk * Math.PI) * 0.6, 0, 0);
  const friendlyTarget = st === 'won' ? 1 : 0;
  dragonFriendly += (friendlyTarget - dragonFriendly) * ef(3);
  dr.root.rotation.y = -dragonFriendly * Math.PI / 2;         // turns to face us and wave
  dr.body.rotation.z = st === 'play' ? -game.tension * 0.2 : 0;
  dr.body.position.y = Math.abs(Math.sin(dragonPhase)) * 0.08;
  dr.legs.forEach((l, i) => { l.rotation.z = Math.sin(dragonPhase + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI / 2 : 0)) * (st === 'won' ? 0.1 : 0.6); });
  if (dragonFriendly > 0.5) dr.legs[0].rotation.z = 2.2 + Math.sin(now * 9) * 0.5;   // waving
  const flap = Math.sin(now * (st === 'won' ? 9 : 7));
  dr.wings.forEach(({ w, s }) => { w.rotation.x = s * (0.15 + flap * 0.45); });
  dr.tail.forEach((seg, i) => { seg.rotation.y = Math.sin(now * 5 - i * 0.7) * 0.35; seg.rotation.z = Math.sin(now * 3 - i) * 0.1; });
  dr.head.rotation.z = Math.sin(now * 2.2) * 0.06 + Math.sin(now * 30) * 0.3 * bk;
  if (bk > 0) dr.body.rotation.z += 0.3 * bk;                  // rocks back on its heels
  // harmless smoke while chasing; hearts once friendly
  if (st === 'play' || st === 'title') {
    puffIn -= dt * (1 + game.tension);
    if (puffIn <= 0) {
      puffIn = rand(1.6, 3);
      dr.nose.getWorldPosition(_p);
      for (let i = 0; i < 3; i++) later(i * 0.12, () => { dr.nose.getWorldPosition(_p); emitPuff(_p); });
      sfx.puff();
    }
  } else if (st === 'won') {
    heartIn -= dt;
    if (heartIn <= 0) { heartIn = 0.45; dr.nose.getWorldPosition(_p); emitPuff(_p, true); }
  }

  // castle: grows closer with progress; slides to the path for the finish
  if (st === 'winning' || st === 'won') {
    castle.position.lerp(CASTLE_WIN, ef(2));
  } else {
    castleProg += (clamp(game.score / cfg.goal, 0, 1) - castleProg) * ef(2);
    _v.copy(CASTLE_FAR).lerp(CASTLE_NEAR, st === 'title' ? 0 : castleProg);
    castle.position.lerp(_v, ef(3));
  }
  if (gateOpen > 0) gateOpen = Math.min(1, gateOpen + dt / 1.2);
  gateDoors.forEach(({ hinge, side }) => { hinge.rotation.y = side * easeOutBack(gateOpen) * 1.5; });

  // obstacles & gems follow their simulated x
  for (const o of obstacles) {
    o.g.position.x = o.x;
    if (o.knock) { o.g.position.set(o.x, o.knock.y, o.knock.z); o.g.rotation.z = o.knock.spin; }
    if (o.frogHop > 0) { o.frogHop -= dt; o.extra.frog.position.y = Math.sin((0.6 - o.frogHop) / 0.6 * Math.PI) * 0.5; }
    if (o.signMat) o.signMat.emissiveIntensity = o.armed ? 0.5 + 0.3 * Math.sin(now * 12) : (o === currentTarget() ? 0.08 + 0.08 * Math.sin(now * 5) : 0);
    for (const gm of o.gems) {
      if (gm.taken) {
        if (gm.m.visible) { gm.pop += dt; const s = Math.max(0, 1 - gm.pop / 0.25); gm.m.scale.multiplyScalar(s > 0 ? 0.85 : 0); gm.m.position.y += dt * 2; if (s <= 0) gm.m.visible = false; }
      } else {
        gm.m.rotation.y += dt * 3;
        gm.m.position.y = gm.y + Math.sin(now * 3 + gm.dx) * 0.06;
      }
    }
  }

  // camera: gentle sway, follows her to the castle, small shake on a bump
  const ct = st === 'won' || st === 'winning' ? new THREE.Vector3(Math.max(1, princessX - 1.5), 1.8, -0.6) : new THREE.Vector3(1.0, 1.3, 0);
  camTarget.lerp(ct, ef(2));
  shake = Math.max(0, shake - dt);
  camera.position.set(
    camTarget.x + CAM_OFFSET.x * camDist + Math.sin(now * 0.3) * 0.25 + (Math.random() - 0.5) * shake * 0.5,
    camTarget.y + CAM_OFFSET.y * camDist + Math.sin(now * 0.23) * 0.12 + (Math.random() - 0.5) * shake * 0.5,
    camTarget.z + CAM_OFFSET.z * camDist);
  camera.lookAt(camTarget);
}

// ---------------------------------------------------------------
//  Resize
// ---------------------------------------------------------------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camDist = clamp(1.5 / camera.aspect, 1, 2.4);   // back up on narrow/portrait screens
  camera.updateProjectionMatrix();
  sparkMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2)));
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------
//  Main loop: fixed-step simulation + per-frame animation
// ---------------------------------------------------------------
function step(dt) {
  dt = Math.min(0.05, Math.max(0, dt));
  now += dt;
  runTimers();
  simulate(dt);
  animate(dt);
  updatePuffs(dt);
  updateRockets(dt);
  updateSparks(dt);
  updateConfetti(dt);
  if (!game.debug.noRender) renderer.render(scene, camera);
}
let lastT = performance.now();
renderer.setAnimationLoop(() => {
  const t = performance.now();
  step((t - lastT) / 1000);                    // clamped to 0.05 inside
  lastT = t;
});

// Test hook (harmless for kids): drive the game deterministically from a hidden pane
window.__pd = {
  step,
  startLevel,
  jump: (key = ' ') => handleKey(key, /^[a-z]$/i.test(key) ? 'Key' + key.toUpperCase() : ''),
  state: () => ({
    state: game.state, level: game.level, score: game.score, goal: LEVELS[game.level].goal, gems: game.gems,
    tension: +game.tension.toFixed(3), y: +P.y.toFixed(3), air: P.air, simTime: +game.simTime.toFixed(4),
    speed: LEVELS[game.level].speed, dragonX: +dragonX.toFixed(2),
    obstacles: obstacles.map(o => ({ type: o.type, x: +o.x.toFixed(3), tta: +(o.x / LEVELS[game.level].speed).toFixed(4), hit: o.hit, passed: o.passed, letter: o.letter, armed: o.armed })),
  }),
  debug: game.debug,
  spawn: type => spawnObstacle(type),
  live: () => obstacles,
  clear: () => clearObstacles(),
  // visible gap between the dragon's front and the princess's back (world units; < 0 = touching)
  gap: () => new THREE.Box3().setFromObject(princess.root).min.x - new THREE.Box3().setFromObject(dragon.root).max.x,
};
</script>
